  <!-- your brand, rendered -->
  <rect x="352" y="110" width="224" height="180" rx="14" fill="#f9f7ff" stroke="#6c3bff" stroke-width="2.5"/>
  <rect x="376" y="134" width="120" height="14" rx="7" fill="#0d0c11"/>
  <rect x="376" y="164" width="176" height="10" rx="5" fill="#ece4fb"/>
  <rect x="376" y="184" width="150" height="10" rx="5" fill="#ece4fb"/>
  <rect x="376" y="204" width="164" height="10" rx="5" fill="#ece4fb"/>
  <rect x="376" y="236" width="92" height="30" rx="15" fill="#6c3bff"/>
  <rect x="480" y="236" width="72" height="30" rx="15" fill="#ffffff" stroke="#d9ccff" stroke-width="2"/>
  <text x="464" y="330" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#9a97a8">your brand</text>
