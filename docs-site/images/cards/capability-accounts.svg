  <rect x="104" y="206" width="124" height="104" rx="14" fill="#ffffff" stroke="#e3e3ec" stroke-width="2"/>
  <rect x="140" y="234" width="52" height="36" rx="6" fill="none" stroke="#9a97a8" stroke-width="2.5"/>
  <path d="M140,238 l26,20 l26,-20" fill="none" stroke="#9a97a8" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="140" y="284" width="52" height="9" rx="4.5" fill="#ececf2"/>
  <circle cx="228" cy="206" r="10" fill="#6c3bff"/>
  <path d="M223,206 l3.5,3.5 l6.5,-7" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- chat -->
  <rect x="258" y="206" width="124" height="104" rx="14" fill="#ffffff" stroke="#e3e3ec" stroke-width="2"/>
  <path d="M304,236 l-6,32 M328,236 l-6,32 M296,246 h38 M292,258 h38" stroke="#9a97a8" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="294" y="284" width="52" height="9" rx="4.5" fill="#ececf2"/>
  <circle cx="382" cy="206" r="10" fill="#6c3bff"/>
  <path d="M377,206 l3.5,3.5 l6.5,-7" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- code -->
  <rect x="412" y="206" width="124" height="104" rx="14" fill="#ffffff" stroke="#e3e3ec" stroke-width="2"/>
  <circle cx="458" cy="238" r="7" fill="none" stroke="#9a97a8" stroke-width="2.5"/>
  <circle cx="458" cy="266" r="7" fill="none" stroke="#9a97a8" stroke-width="2.5"/>
  <circle cx="486" cy="252" r="7" fill="none" stroke="#9a97a8" stroke-width="2.5"/>
  <path d="M458,245 v14 M464,242 a30,30 0 0 1 16,6" stroke="#9a97a8" stroke-width="2.5" fill="none"/>
  <rect x="448" y="284" width="52" height="9" rx="4.5" fill="#ececf2"/>
  <circle cx="536" cy="206" r="10" fill="#6c3bff"/>
  <path d="M531,206 l3.5,3.5 l6.5,-7" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="320" y="352" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#9a97a8">connected once · runs as them</text>
</svg>
