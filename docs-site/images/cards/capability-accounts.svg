  <circle cx="320" cy="112" r="30" fill="#ece5ff" stroke="#6c3bff" stroke-width="2.5"/>
  <circle cx="320" cy="103" r="9" fill="#6c3bff"/>
  <path d="M303,130 a17,13 0 0 1 34,0" fill="#6c3bff"/>
  <text x="320" y="70" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#9a97a8">your user</text>
  <!-- connections -->
  <path d="M300,134 C240,164 190,180 166,206" stroke="#d9ccff" stroke-width="2.5" fill="none"/>
