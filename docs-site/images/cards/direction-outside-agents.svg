<svg width="640" height="400" viewBox="0 0 640 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Your own agent reaching your app over MCP, acting as the signed-in user">
  <rect width="640" height="400" fill="#f7f7fa"/>
  <!-- your agent: terminal -->
  <rect x="48" y="96" width="224" height="200" rx="14" fill="#0d0c11"/>
  <circle cx="72" cy="122" r="4.5" fill="#43414f"/>
  <circle cx="90" cy="122" r="4.5" fill="#43414f"/>
  <circle cx="108" cy="122" r="4.5" fill="#43414f"/>
  <rect x="72" y="152" width="120" height="11" rx="5" fill="#4a4860"/>
  <rect x="72" y="174" width="88" height="11" rx="5" fill="#4a4860"/>
  <rect x="72" y="196" width="132" height="11" rx="5" fill="#4a4860"/>
  <rect x="72" y="222" width="14" height="18" rx="2" fill="#a78bfa"/>
  <text x="160" y="336" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#9a97a8">your agent</text>
  <!-- MCP connector -->
  <line x1="272" y1="196" x2="360" y2="196" stroke="#c9bcff" stroke-width="3"/>
  <path d="M356,187 L368,196 L356,205 Z" fill="#c9bcff"/>
  <rect x="288" y="178" width="64" height="36" rx="18" fill="#6c3bff"/>
  <text x="320" y="203" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#ffffff">MCP</text>
  <!-- your app window -->
  <rect x="368" y="96" width="224" height="200" rx="14" fill="#ffffff" stroke="#e3e3ec" stroke-width="2"/>
  <circle cx="392" cy="122" r="4.5" fill="#d9d9e3"/>
  <circle cx="410" cy="122" r="4.5" fill="#d9d9e3"/>
  <circle cx="428" cy="122" r="4.5" fill="#d9d9e3"/>
  <!-- signed-in user badge -->
  <circle cx="562" cy="122" r="11" fill="#ece5ff" stroke="#6c3bff" stroke-width="2"/>
  <path d="M556,122 l4,4 l8,-9" stroke="#6c3bff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- app content skeleton -->
  <rect x="392" y="150" width="110" height="13" rx="6" fill="#e6e6ee"/>
  <rect x="392" y="178" width="150" height="10" rx="5" fill="#efeff4"/>
  <rect x="392" y="198" width="120" height="10" rx="5" fill="#efeff4"/>
  <rect x="392" y="224" width="178" height="48" rx="8" fill="#f7f4ff" stroke="#d9c9ff" stroke-width="2"/>
  <rect x="406" y="236" width="80" height="8" rx="4" fill="#e2d6ff"/>
  <rect x="406" y="252" width="110" height="8" rx="4" fill="#e2d6ff"/>
  <text x="480" y="336" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#9a97a8">your app</text>
</svg>
