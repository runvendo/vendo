StylesPath = styles
MinAlertLevel = warning
# code/tt are Vale's defaults (fenced code blocks, inline code spans);
# frontmatter is added explicitly since Vale does not exclude YAML
# frontmatter by default.
IgnoredScopes = code, tt, frontmatter

# Mintlify content is .mdx; treat it as Markdown for parsing (code fences,
# inline code, headings, YAML frontmatter) so only prose gets linted.
[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = ai-tells

# Strip JSX/HTML component tags (<Card>, <Steps>, </Update>, self-closing
# <VendoPalette .../>, prop lists included) before Vale scans prose, so tag
# names and attribute values are never treated as prose. Vale's native
# Markdown parser already excludes fenced code blocks, inline code spans,
# and YAML frontmatter from prose scope.
BlockIgnores = (?s)(<[A-Za-z][A-Za-z0-9]*(?:\s+[^<>]*)?/?>|</[A-Za-z][A-Za-z0-9]*\s*>)
TokenIgnores = (<[A-Za-z][A-Za-z0-9]*(?:\s+[^<>]*)?/?>|</[A-Za-z][A-Za-z0-9]*\s*>)
