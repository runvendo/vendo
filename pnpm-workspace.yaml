packages:
  - "packages/*"
  - "fixtures/*"
  - "examples/*"
  - "corpus/harness"
  - "corpus/hosts/*"
  - "genbench"

# pnpm 9 ran every dependency build script; pnpm 11 (strictDepBuilds) requires
# an explicit allowlist. These five are the deps with build scripts in the
# tree — all allowed, preserving pnpm 9 behavior. workerd is miniflare's
# runtime for the portability gate (scripts/portability-gate.mjs).
allowBuilds:
  # zstd + lzma are just-bash's OPTIONAL native backends for its compressed-tar
  # commands. just-bash is a devDependency (the workspace's bash tests) and
  # nothing in the tree compresses an archive through it, so the native builds
  # are denied rather than compiled — running two build scripts would widen the
  # supply-chain surface for a code path with no caller. Kept rather than
  # dropped because the packages remain in the install graph and strictDepBuilds
  # fails a cold install that merely ignores them. Flip to true the day a
  # bash-native harness needs `tar -z`.
  '@mongodb-js/zstd': false
  cbor-extract: true
  esbuild: true
  node-liblzma: false
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true

# 2026-08-07 advisories: image-size GHSA-w3rx-r6r6-pgpr (ICNS parser infinite
# loop) and GHSA-5p2g-fcmc-qvqq (JXL/HEIF parsers infinite loop), both HIGH,
# via examples/mastra-agent > @mastra/memory > image-size. Not a
# stale-lockfile case like every floor in `overrides` below: GitHub's own
# advisory records report first_patched_version: null for both, and
# image-size's last release anywhere (npm or GitHub) is 2.0.2 from April
# 2025 — the "patched >=2.0.3" pnpm audit prints does not exist. Checked
# upstream too: @mastra/memory 1.26.0 (2026-08-05, its current latest) still
# pins image-size exactly at 1.2.1, so no version bump anywhere in the chain
# reaches a fix. Ignored by advisory ID (pnpm's own mechanism for this,
# `pnpm audit --ignore <GHSA-ID>`, which persists here) rather than an
# `overrides` floor that can't resolve to a real package version. Re-check
# both IDs whenever image-size cuts a new release; drop the ignores once one
# ships >=2.0.3.
auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq

minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.214'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.214'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.214'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.214'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.214'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.214'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.214'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.214'
  - '@anthropic-ai/claude-agent-sdk@0.3.214'

# The 2026-07-24 GHSA-mh99-v99m-4gvg ignore is GONE (2026-08-03): the 1.x/2.x
# backports it was waiting on landed (1.1.17, 2.1.3), so the advisory is fixed
# by the per-line brace-expansion floors below instead of masked.

# pnpm 11 no longer reads the `pnpm` field in package.json; overrides live here.
overrides:
  "@types/react": "^19.2.0"
  # Security floor (2026-07-21 advisory): sharp/libvips GHSA-f88m-g3jw-g9cj.
  # This one really does reach us only via examples/demos.
  "sharp": ">=0.35.0"
  # fast-uri: floor 3.1.4 (GHSA-v2hh-gcrm-f6hx, 2026-07-21) raised to 4.1.2 for
  # the 2026-08-03 host-confusion advisory GHSA-7p8r-x3mc-p8w7 (>=4.0.0 <4.1.2).
  #
  # This is NOT examples-only, as this block used to claim. `pnpm why --prod`
  # puts it in the published trees of @vendoai/{vendo,mcp,apps,harnesses}:
  # vendo depends on ajv and ajv-formats directly, mcp on
  # @modelcontextprotocol/sdk>ajv, and apps/harnesses on
  # @anthropic-ai/claude-agent-sdk>@modelcontextprotocol/sdk>ajv. Not exploitable
  # today — ajv resolves $ref/$id in schemas we author, not attacker-supplied
  # ones, and nothing authorizes off the parsed authority — but an advisory that
  # ships in the tarballs should not be filed under "demos only".
  #
  # Bounded to <5. ajv declares `fast-uri: ^3.0.1`, so this floor is already
  # outside its consumer's declared range: the unbounded ">=3.1.4" is exactly
  # what walked the tree across a major, months ago, with nobody deciding to.
  # 4.x has been in the lockfile and green since July so this does not revert
  # it, but the next major must not arrive the same silent way. Every other
  # security floor added on 2026-08-03 is bounded; this is the last one that
  # was not. Drop the bound only after checking what ajv actually supports.
  "fast-uri": ">=4.1.2 <5"
  # 2026-07-23 advisories: Auth.js fail-open + email-normalizer criticals
  # (via demo-bank), Next.js App Router middleware-bypass + DoS highs
  # (examples/demos/fixtures).
  "next-auth": ">=5.0.0-beta.32"
  "next": ">=16.2.11"
  "@types/react-dom": "^19.2.0"
  # 2026-07-24 advisory: PostCSS path traversal in previous source map,
  # GHSA-r28c-9q8g-f849 (<=8.5.17) — floor raised from the earlier 8.5.10 line.
  # Raised again 2026-08-06 to 8.5.23 for GHSA-fxqj-rqcc-2cmp (<=8.5.22), the
  # incomplete-fix follow-up to GHSA-6g55-p6wh-862q. The override exists at all
  # because next pins postcss exactly (16.2.11 -> 8.4.31), so the consumers
  # (examples/{ai-sdk-agent,demo-bank} > next, demo-bank > next-auth > next)
  # cannot reach the patch on their own. Drop it once every next in the tree
  # pins >=8.5.23 (next 16.3.0 does).
  "postcss@<8.5.23": ">=8.5.23"
  # 2026-08-06 advisory: js-yaml quadratic CPU consumption resolving !!omap,
  # GHSA-5p4m-2wfm-xmqj / CVE-2026-59870 (>=3.0.0 <3.15.1 and >=4.0.0 <4.3.1).
  # This is the HIGH that reddened the required `audit` check repo-wide.
  #
  # The 3.x line is the prod path: examples/mastra-agent > @mastra/core >
  # gray-matter, which declares `js-yaml: ^3.13.1` and is itself unmaintained at
  # 4.0.3, so the 3.15.1 backport is already inside its declared range — the
  # lockfile was simply pinned to 3.15.0. Floored per major line, and bounded,
  # because gray-matter calls the removed 3.x `safeLoad` API: letting this floor
  # walk to 4.x or 5.x would break that CJS consumer at runtime.
  #
  # The 4.x floor is dev-tooling hygiene, not a prod fix — 4.3.0's only
  # consumers are @changesets/parse and @eslint/eslintrc, which is why
  # `pnpm audit --prod` never flagged it. Same advisory, so it is closed here
  # rather than left to rot until the day a prod path picks up js-yaml 4.
  "js-yaml@>=3 <3.15.1": ">=3.15.1 <4"
  "js-yaml@>=4 <4.3.1": ">=4.3.1 <5"
  # 2026-08-06 advisory: node-tar uncontrolled recursion in mapHas/filesFilter,
  # an uncatchable stack-overflow DoS from a crafted long-path archive,
  # GHSA-r292-9mhp-454m (<=7.5.20). Reaches the prod graph only via
  # examples/demo-bank > e2b, which declares `tar: ^7.5.19` — the patch is
  # inside its range and the lockfile was pinned to 7.5.20. Bounded to the 7.x
  # line that is actually installed.
  "tar@>=7 <7.5.21": ">=7.5.21 <8"
  # 2026-08-06 advisories, both arriving through @modelcontextprotocol/sdk:
  #   - hono ReDoS in the CORS middleware via Access-Control-Request-Headers,
  #     GHSA-8j4g-w8fx-2239 (<4.12.34). The sdk declares `hono: ^4.11.4`, so
  #     the patch is in range; the lockfile was pinned to 4.12.29.
  #   - @hono/node-server path traversal in serve-static on Windows via an
  #     encoded backslash, GHSA-frvp-7c67-39w9 (<2.0.5).
  #
  # Not examples-only: `pnpm why --prod` puts both in the published
  # @vendoai/{mcp,apps,harnesses} trees (apps/harnesses via
  # @anthropic-ai/claude-agent-sdk>@modelcontextprotocol/sdk), alongside
  # examples/mastra-agent>@mastra/core.
  #
  # The node-server floor is the one deliberate exception to this file's
  # don't-cross-a-major rule: there is NO 1.x backport — upstream's only
  # patched version is 2.0.5 — so the choice is 2.x or carry the advisory
  # forever. Checked rather than assumed, because the installed sdk (1.29.0)
  # still declares `^1.19.9`, i.e. this floor is outside its range:
  #   - sdk 1.30.0 declares `^1.19.9 || ^2.0.5`, so upstream has blessed 2.x;
  #   - sdk 1.29.0 imports exactly `serve` and `getRequestListener`, and 2.1.0
  #     exports both (its breaking changes are elsewhere);
  #   - @hono/node-ws@1.3.1 lists node-server as a peer but imports nothing
  #     from it at runtime (only `hono/ws`, `node:http`, `ws`), so the unmet
  #     peer range is types-only.
  # Drop this floor once the tree carries @modelcontextprotocol/sdk >=1.30.0,
  # which asks for the patched line itself. Both bounded below the next major.
  "hono@>=4 <4.12.34": ">=4.12.34 <5"
  "@hono/node-server@<2.0.5": ">=2.0.5 <3"
  # 2026-08-03 advisory: brace-expansion DoS via unbounded intermediate arrays
  # bypassing the CVE-2026-14257 mitigation, GHSA-rgw5-rvv9-x895 (<1.1.18 and
  # >=4.0.0 <5.0.9). Reaches the prod graph only transitively:
  # e2b>glob@11>minimatch@10 (demo-bank's sandbox) and
  # mastra>archiver>readdir-glob>minimatch@10 are both the 5.x line;
  # mastra>serve-handler>minimatch@3 is the 1.x line. minimatch@9 is NOT on
  # either of those paths — its only consumer in the tree is test-exclude
  # (@vitest/coverage-v8), which is why `pnpm audit --prod` never flagged the
  # 2.x copy. The 2.x floor below is dev-tooling hygiene, not a prod fix.
  #
  # Floored PER MAJOR LINE, not globally, because brace-expansion 5.x is
  # ESM-first and swapping it under minimatch@3 breaks that CJS consumer at
  # runtime (`expand is not a function`). The 1.x/2.x floors are the upstream
  # backports, which stay plain-CJS. These also close the older
  # GHSA-mh99-v99m-4gvg (>=1.1.17 / >=2.1.3 / >=5.0.8), whose ignore entry is
  # deleted above.
  # Both sides of each pair are bounded on purpose: an unbounded ">=1.1.18"
  # right-hand side resolves to the newest brace-expansion overall (5.x), which
  # is precisely the cross-major swap that breaks minimatch@3 — verified.
  #
  # The 2.x floor is 2.1.4, not GHSA-mh99's 2.1.3: rgw5's own 2.x patch is
  # 2.1.4 (vulnerable range >=2.0.0 <2.1.4), so a 2.1.3 floor would still admit
  # a version vulnerable to the advisory this block is named for. Resolution is
  # unchanged — ">=2.1.3 <3" already picked 2.1.4 — this just stops the floor
  # from permitting a hole it silently allowed.
  "brace-expansion@<1.1.18": ">=1.1.18 <2"
  "brace-expansion@>=2 <2.1.4": ">=2.1.4 <3"
  "brace-expansion@>=4 <5.0.9": ">=5.0.9 <6"
  # 2026-08-03 advisory: undici cross-user information disclosure + parse-time
  # crash via degenerate private cache directives, GHSA-4cwx-7wf7-3272
  # (>=7.0.0 <7.29.0). Scoped to the 7.x line (the only one in the tree, via
  # demo-bank>e2b) so a 6.x consumer would not be dragged across a major.
  "undici@>=7 <7.29.0": ">=7.29.0 <8"
  # 2026-08-03 advisory: ip-address parses leading-zero octets as decimal while
  # resolvers read them as octal, giving an SSRF / trust-boundary bypass,
  # GHSA-mwp4-54f8-5fhr (<=10.3.0). Arrives via
  # @modelcontextprotocol/sdk>express-rate-limit — which is not only mastra's:
  # `pnpm why --prod` puts it in the published @vendoai/{mcp,apps,
  # harnesses,vendo} trees too. Not exploitable today (the consumer is
  # express-rate-limit's IPv4 key generator, so the worst case is bucket
  # confusion from a spoofed X-Forwarded-For, not an authz decision), but
  # ip-address is the library an SSRF allowlist would be built on, so a
  # known-bad copy should not ride along in the tarballs. Left side scoped to the
  # 10.x line that is actually installed rather than the advisory's open-ended
  # "<=10.3.0", so a hypothetical 9.x consumer is not dragged across a major.
  "ip-address@>=10 <10.3.1": ">=10.3.1 <11"
  # 2026-08-07 advisory: nanoid custom generators loop indefinitely when size
  # is zero, GHSA-2v37-7h3g-55p8. Arrives via
  # examples/{ai-sdk-agent,demo-bank}>next>postcss>nanoid (16 paths) — postcss
  # declares `nanoid: ^3.3.16`, so the patch is already inside its declared
  # range and the lockfile was simply pinned to 3.3.16. Bounded to the 3.x
  # line that is actually installed; the advisory's other range (>=4.0.0
  # <5.1.6) has no consumer in this tree.
  #
  # Floor raised 3.3.17 -> 3.3.18 (2026-08-13): the advisory's 3.x range was
  # widened to <3.3.18 — 3.3.17 carried a follow-up commit and the record now
  # names 3.3.18 as the only patched 3.x — so the old floor resolved to exactly
  # the version the advisory calls vulnerable, reddening the required `audit`
  # check on main. Still inside both consumers' declared ranges (postcss
  # ^3.3.16, @ai-sdk/provider-utils ^3.3.8).
  "nanoid@<3.3.18": ">=3.3.18 <4"
