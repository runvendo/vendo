packages:
  - "packages/*"
  - "fixtures/*"
  - "examples/*"
  - "corpus/harness"
  - "corpus/hosts/*"
  - "bench"
  - "spikes/*"
  # tools/ is NOT globbed: tools/demo-router is deliberately standalone (its own
  # zero-dependency deploy). The video harness and genui-bench are listed
  # explicitly instead — they render the real @vendoai/* components, so they
  # must resolve them through the workspace rather than a published range.
  - "tools/video-studio"
  - "tools/genui-bench"
  # install-dx-creds is evidence-only and needs zod ^4 (Claude Agent SDK peer);
  # keeping it in the workspace flips zod peer resolution to 4.x for every
  # ai-SDK consumer (packages/agent, packages/ui, fixtures, ...). It installs
  # standalone with its own lockfile instead — see spikes/install-dx-creds/README.md.
  - "!spikes/install-dx-creds"

# pnpm 9 ran every dependency build script; pnpm 11 (strictDepBuilds) requires
# an explicit allowlist. These five are the deps with build scripts in the
# tree — all allowed, preserving pnpm 9 behavior. workerd is miniflare's
# runtime for the portability gate (scripts/portability-gate.mjs).
allowBuilds:
  # Scarf is install telemetry riding in via @copilotkit/runtime (genui-bench
  # only); its postinstall phones home, so it stays denied.
  '@scarf/scarf': false
  cbor-extract: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.214'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.214'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.214'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.214'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.214'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.214'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.214'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.214'
  - '@anthropic-ai/claude-agent-sdk@0.3.214'

# TEMPORARY (2026-07-24): brace-expansion unbounded-expansion DoS
# GHSA-mh99-v99m-4gvg is ignored because its only patched version (5.0.8)
# breaks CJS consumers at runtime (minimatch@3's `expand is not a function`
# — verified empirically) and the 1.x/2.x lines have no backports yet. The
# package only ever sees developer-authored glob patterns in this tree, never
# untrusted input. REMOVE this ignore as soon as upstream backports land.
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg

# pnpm 11 no longer reads the `pnpm` field in package.json; overrides live here.
overrides:
  "@types/react": "^19.2.0"
  # Security floors (2026-07-21 advisories): fast-uri GHSA-v2hh-gcrm-f6hx,
  # sharp/libvips GHSA-f88m-g3jw-g9cj — both reach us only via examples/demos.
  "fast-uri": ">=3.1.4"
  "sharp": ">=0.35.0"
  # 2026-07-23 advisories: Auth.js fail-open + email-normalizer criticals
  # (via demo-bank), Next.js App Router middleware-bypass + DoS highs
  # (examples/demos/fixtures).
  "next-auth": ">=5.0.0-beta.32"
  "next": ">=16.2.11"
  "@types/react-dom": "^19.2.0"
  # 2026-07-24 advisory: PostCSS path traversal in previous source map,
  # GHSA-r28c-9q8g-f849 (<=8.5.17) — floor raised from the earlier 8.5.10 line.
  "postcss@<8.5.18": ">=8.5.18"
