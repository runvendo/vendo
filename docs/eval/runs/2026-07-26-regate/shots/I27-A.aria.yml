      - region "Open app":
        - heading "Engagement letter status" [level=3]
        - text: Signed and outstanding engagement letters across all active clients for the current filing season.
        - status: About this view Engagement letters and e-signature data are not available through this practice's connected tools. The host exposes document checklists, filing deadlines, and client progress — but engagement letter signing status is not part of that data. To track signed letters, consider adding engagement letters as a document type in each client's checklist.
        - heading "Client document checklist status" [level=3]
        - text: All active clients with their document collection progress and current status. Use this as a proxy for engagement readiness until letter tracking is available.
