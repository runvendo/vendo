  - status: Rewards points not available This host does not expose a credit card rewards or points balance — points totals, earn rates, and redemption history cannot be shown with real data. To check your rewards, visit your card issuer's app or website directly.
  - heading "How to redeem rewards" [level=3]
  - article: Statement credit Apply points as a credit toward your card balance. Typically 1 cent per point. Log in to your card issuer's portal and choose 'Redeem for statement credit'.
  - article: Travel booking Book flights, hotels, or car rentals through your issuer's travel portal. Points often go further here — sometimes 1.25–1.5 cents per point.
  - article: Gift cards Exchange points for gift cards at popular retailers. Usually 1 cent per point, with occasional bonus offers.
  - article: Cash back / direct deposit Transfer the cash value of your points to a linked bank account. Check your issuer's minimum redemption threshold.
  - article: Transfer to airline or hotel partners Move points to loyalty programs (e.g. airline miles, hotel points) for potentially higher value. Transfer ratios vary by issuer.
  - heading "Recent card spending" [level=3]
  - text: Spending activity across your cards — useful for estimating points earned if your card earns per dollar spent.
