  - status: About rewards points Maple tracks your card activity and balances in real time. Rewards points balances and redemption options are managed directly by your card network (Visa, Mastercard, Amex, etc.) and are not exposed through this host's data — so live point totals cannot be shown here.
  - heading "How to Redeem Your Rewards" [level=3]
  - article: Statement Credit Log in to your card issuer's portal and apply points as a credit against your balance. Most issuers value points at 1 cent each for this option.
  - article: Travel Booking Redeem through your issuer's travel portal for flights, hotels, and car rentals — often at a higher value per point (1.25–1.5 cents).
  - article: Gift Cards Exchange points for gift cards at popular retailers. Value varies by issuer and retailer.
  - article: Cash Back / Direct Deposit Some issuers let you deposit rewards directly to a linked bank account. Check your card's rewards program for eligibility.
  - article: Transfer to Partners Premium cards often allow point transfers to airline and hotel loyalty programs, where value can exceed 2 cents per point.
  - heading "Recent Card Spending" [level=3]
