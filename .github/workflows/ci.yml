name: CI
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue evaluates the REQUIRED checks on this event. Every workflow
  # that provides one of them (ci, integration, conformance, audit) must list
  # merge_group or the queue waits forever for a check that will never report —
  # including on the PR that would fix it. All four live in this file and this
  # is the only workflow that needs it; the other three (mintlify-automerge,
  # release, version-packages) provide no required check.
  merge_group:

permissions:
  contents: read

# A new push to a PR supersedes the previous run; cancel it. Pushes to main
# never cancel each other (every main commit keeps its full record), and a
# merge_group run is never cancelled either — github.ref is the queue's own
# gh-readonly-queue branch, unique per entry, and cancelling one fails its
# queue entry.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The old `ci` job did install → build → test:coverage (24 min) → typecheck →
# lint on ONE runner, ~30 min wall. It is now, all fanned out over the shared
# turbo remote cache so the fan-out does not multiply the build:
#   cone              computes the affected cone once, for everything below
#   typecheck-lint    the non-test half
#   changeset-required a PR that changes a publishable package carries a changeset
#   test-shards       9 intra-package vitest shards for the big three
#                     (vendo x4, store x3, ui x2 — 40 of the 55 serial minutes)
#   test-rest         every other package, one job, one turbo run
#   ai-dual           the same suites against the OTHER AI SDK major (ai@7),
#                     which is the only thing that can prove the peer range,
#                     sharded the same way (vendo x4, ui x2, rest)
#   coverage-merge    merges the shards' blob reports and enforces the
#                     per-package coverage floors (they cannot be enforced on a
#                     single shard — see the comment on that job)
#   ci                aggregate; KEEPS the required-check name `ci`
#   integration-legs  the e2e fleet in 5 duration-balanced legs
#   integration       aggregate; KEEPS the required-check name `integration`
#   conformance       the three-package conformance suite
#   audit             supply-chain gate
# Required checks on main are: ci, integration, conformance, audit.
# Renaming any of those job names breaks merges. Both `ci` and `integration`
# are aggregates over jobs that legitimately SKIP, so both use `if: always()`
# plus explicit success-or-skipped arithmetic rather than `needs` semantics.
#
# WHAT RUNS WHERE (2026-08-16):
#   pull_request  the affected cone only — turbo's --affected against the PR's
#                 base branch. A big-three package's shards run only when that
#                 package is in the cone; coverage-merge does not run at all,
#                 because a coverage floor measured against a cone is not the
#                 floor. Cheap signal, fast merges.
#   merge_group   the same cone, computed against the queue's base branch.
#   push to main  NO filter. Every shard, every package, plus coverage-merge
#                 with the real per-package floors. This is the backstop that
#                 makes cone-only PR CI safe, and the workflow going red on
#                 main is the whole notification — there is no pager.
#
# The gap that backstop is covering, stated plainly: the cone is turbo's
# dependency graph, and inputs outside the graph are invisible to it.
# docs-site/ is not a workspace package, so a docs-only change puts nothing in
# the cone — yet @vendoai/vendo's docs-rot suite readFile()s docs-site/*.mdx.
# That exact hole merged green once already (#1139) back when the shards had an
# --affected skip, which is why the skip was removed. It is deliberately back,
# with the difference that main now runs the full suite on every push instead
# of only at release time, so the blast radius is one red commit on main rather
# than hours of invisible rot.
#
# No browser runs here (Yousef's call, 2026-08-06): headless CI mis-resolves
# :focus-visible and light-dark(), so the Playwright suites were a slow gate
# that could not judge the thing they were watching. They stay the LOCAL
# pre-PR gate — `pnpm --filter @vendoai/ui test:browser` and
# `pnpm --filter @vendoai-fixtures/integration-browser test:browser` — under
# the UI-LAW browser-verification step.
jobs:
  # ONE place computes the cone, because test-shards has to know which of the
  # big three are in it BEFORE its matrix expands — a job-level `if:` cannot see
  # the `matrix` context, so the gate has to arrive as a `needs` output.
  #
  # Outputs, consumed verbatim by every job below:
  #   base    the git ref to diff against, or "" on a push to main
  #   filter  "--affected", or "" on a push to main (the full suite)
  #   big3    space-separated subset of "vendo store ui" whose shards should run
  #
  # Fails OPEN. If the probe itself breaks, filter is "" and big3 is all three,
  # i.e. the full suite runs. A broken probe must never be the reason a suite
  # did not run — that is the failure mode this whole design is guarding.
  cone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      base: ${{ steps.resolve.outputs.base }}
      filter: ${{ steps.resolve.outputs.filter }}
      big3: ${{ steps.resolve.outputs.big3 }}
      heavy: ${{ steps.heavy.outputs.heavy }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # turbo --affected diffs against the base branch
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve the affected cone
        id: resolve
        # Via env, not inline ${{ }}: a branch name is allowed to contain shell
        # metacharacters, and this string would otherwise be pasted into the
        # script body.
        env:
          # pull_request hands the base as `main`; merge_group as
          # `refs/heads/main`; a push to main hands neither.
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          set -uo pipefail
          full() {
            { echo "base="; echo "filter="; echo "big3=vendo store ui"; } >> "$GITHUB_OUTPUT"
          }
          if [ -z "$BASE_REF" ]; then
            echo "no base ref (push to main) — full suite, no cone"
            full; exit 0
          fi
          base="origin/${BASE_REF#refs/heads/}"
          echo "cone base: $base"
          if ! TURBO_SCM_BASE="$base" pnpm turbo ls --affected --output=json > /tmp/affected.json; then
            echo "::warning::affected probe failed — falling open to the full suite"
            full; exit 0
          fi
          jq -r '.packages.items[].name' /tmp/affected.json | sort > /tmp/affected-names.txt
          echo "::group::affected packages ($(wc -l < /tmp/affected-names.txt))"
          cat /tmp/affected-names.txt
          echo "::endgroup::"
          big3=""
          for p in vendo store ui; do
            if grep -qx "@vendoai/$p" /tmp/affected-names.txt; then big3="$big3 $p"; fi
          done
          echo "big three in cone:${big3:- (none)}"
          { echo "base=$base"; echo "filter=--affected"; echo "big3=$big3"; } >> "$GITHUB_OUTPUT"
      # The changesets version PR ("chore: version packages", branch
      # changeset-release/*) rewrites CHANGELOGs and package.json versions and
      # nothing else. Running the e2e fleet against it buys nothing.
      #
      # It skips the HEAVY jobs only. typecheck-lint still runs — a version bump
      # can break the build through the lockfile — and all four required checks
      # still report, green by skip. That distinction is load-bearing: PR #1342
      # exists precisely so this PR gets CI without the close/reopen ritual, and
      # a required check that never reports would mean no release could ever
      # ship again.
      #
      # Detected from the title as well as the branch so it survives the
      # merge_group event, where the source branch name is gone (github.ref is
      # the queue's own gh-readonly-queue/... branch) but the head commit
      # message is not.
      - name: Heavy jobs or not
        id: heavy
        env:
          HEAD_REF: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title || github.event.merge_group.head_commit.message }}
        run: |
          heavy=true
          case "$HEAD_REF" in changeset-release/*) heavy=false ;; esac
          case "$TITLE" in "chore: version packages"*) heavy=false ;; esac
          # A push to main always runs everything, whatever it is called.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then heavy=true; fi
          echo "heavy jobs: $heavy"
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"

  typecheck-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: cone
    env:
      TURBO_SCM_BASE: ${{ needs.cone.outputs.base }}
      CONE: ${{ needs.cone.outputs.filter }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # turbo --affected diffs against the base branch
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Turbo remote cache (GitHub-cache backed)
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      - run: pnpm install --frozen-lockfile
      # The root `pnpm build` / `typecheck` / `lint` scripts unrolled, so the
      # per-package half can take $CONE while the repo-wide half cannot.
      # $CONE is "" on a push to main, which is exactly those scripts again.
      - run: pnpm turbo run build $CONE
      - run: pnpm turbo run typecheck $CONE
      # Neither guard is a turbo task and neither is package-scoped — they walk
      # the whole tree in seconds. They always run.
      - run: node scripts/dependency-guard.mjs
      # portability-gate reads BUILT output — packages/{vendo,store,actions,
      # vendo-telemetry,apps,harnesses}/dist — and used to get it for free from
      # the unconditional `pnpm build` that stood here. Under a cone that build
      # can produce nothing, and the gate died on a missing
      # packages/vendo/dist/server.js. So it now asks for exactly what it reads:
      # these three roots pull the other three in as workspace deps, and the
      # whole thing is a remote-cache replay because main's full build filled
      # the cache. Explicit beats the old implicit ordering, which was one
      # `pnpm build` away from this same failure at any time.
      - run: pnpm turbo run build --filter=@vendoai/vendo --filter=@vendoai/apps --filter=@vendoai/harnesses
      - run: node scripts/portability-gate.mjs
      # `//#lint:packages` is a ROOT task (one eslint over all of packages/), so
      # it has no place in a package cone. Run unfiltered: turbo caches it on
      # its own declared inputs, so an untouched packages/ replays in seconds,
      # and a PR that edits only eslint.blocking.config.mjs — which puts nothing
      # in the cone — still gets linted.
      - run: pnpm turbo run lint:packages
      - run: pnpm turbo run lint $CONE

  # #1570 was a fix that changed a package, merged green, and released nothing:
  # a changeset is the only thing that turns a merge into a version, and nothing
  # was checking for one. `changeset status` is the enforcer rather than path
  # matching, because it asks changesets itself — it knows which packages are
  # publishable (private fixtures and examples do not count, verified), and its
  # own `pnpm changeset --empty` is the escape hatch for a change that ships
  # nothing.
  #
  # Skipped exactly where a changeset cannot be expected: the version PR, which
  # CONSUMES them (`heavy`), and a push to main, where `base` is empty because
  # there is no branch point left to diff against. It inherits the cone's
  # fail-open with that same `base` — a broken probe steps this check aside
  # rather than blocking on a diff it cannot compute.
  changeset-required:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: cone
    if: needs.cone.outputs.heavy == 'true' && needs.cone.outputs.base != ''
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # changeset status diffs against the base branch
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Via env, not inline ${{ }}: a base branch name is allowed to contain
      # shell metacharacters — same reason as the cone job's resolve step.
      - env:
          BASE: ${{ needs.cone.outputs.base }}
        run: pnpm changeset status --since="$BASE"

  # The big three, split file-wise inside each package. Coverage is collected
  # per shard as a BLOB report and merged in coverage-merge; the per-shard runs
  # pass --coverage.thresholds.lines=0 because vitest enforces the package's
  # floor against whatever that shard happened to cover (measured back when a
  # `kit` package still existed: its shard 1/2 reported 48% of the 94% the whole
  # suite reaches, and a floor of 90 fails the shard). Zeroing it here moves the
  # floor to the merge, where the number is the real one — the gate is not
  # weakened, it is moved to the only place it can be correct.
  test-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: cone
    # NOTE: only packages/store reads POSTGRES_URL anywhere in the tree
    # (grep-verified across every packages/*/src and packages/*/tests), so the 4
    # vendo and 2 ui shards each pay ~20s of container init for a database
    # nothing they run can see. Left in place deliberately: GitHub Actions has
    # no YAML anchors, so a per-matrix-entry service map means either a 250-char
    # JSON blob repeated on three lines or splitting store into a second copy of
    # this whole job — both of which cost more to read than 20s on a job that is
    # not the critical path. Worth revisiting together with the store shard
    # rebalance, which is where store's real time goes (store-1 was 409s of a
    # 507s run on 1a875d4c).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vendo
          POSTGRES_PASSWORD: vendo
          POSTGRES_DB: vendo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          # 4 shards, not 3: vitest deals files by count, not duration, and at
          # 3 the full-stack suites clustered on shard 2 (7m25s vs its
          # siblings' ~4m45s — measured on the #849 proof run), making it tie
          # integration as the whole run's critical path.
          - { name: vendo-1, key: vendo, pkg: "@vendoai/vendo", dir: packages/vendo, shard: "1/4" }
          - { name: vendo-2, key: vendo, pkg: "@vendoai/vendo", dir: packages/vendo, shard: "2/4" }
          - { name: vendo-3, key: vendo, pkg: "@vendoai/vendo", dir: packages/vendo, shard: "3/4" }
          - { name: vendo-4, key: vendo, pkg: "@vendoai/vendo", dir: packages/vendo, shard: "4/4" }
          - { name: store-1, key: store, pkg: "@vendoai/store", dir: packages/store, shard: "1/3", tsc: "true" }
          - { name: store-2, key: store, pkg: "@vendoai/store", dir: packages/store, shard: "2/3", tsc: "true" }
          - { name: store-3, key: store, pkg: "@vendoai/store", dir: packages/store, shard: "3/3", tsc: "true" }
          - { name: ui-1, key: ui, pkg: "@vendoai/ui", dir: packages/ui, shard: "1/2" }
          - { name: ui-2, key: ui, pkg: "@vendoai/ui", dir: packages/ui, shard: "2/2" }
    env:
      POSTGRES_URL: postgres://vendo:vendo@localhost:5432/vendo_test
      # 4, not the laptop's 2. This is the ONE place the two-worker cap can be
      # lifted safely: a shard runs exactly one package's vitest, so there is no
      # outer turbo layer to multiply against — which is what the cap exists to
      # stop (a 12-core laptop at ~27 workers, and an OOM kill on a 15GB runner
      # when 4 packages each sized their own pool). test-rest, which DOES have
      # that outer layer, keeps 2. The root scripts and the laptop are untouched.
      #
      # MIN stays 1 rather than matching MAX: the reason MIN must be set at all
      # is that vitest 2.1 defaults minThreads to the CPU count independently of
      # the max, so a max-only cap throws `minThreads and maxThreads must not
      # conflict` before a test runs — and MIN=1 prevents that just as well.
      # Pinning MIN=4 would instead force four PGlite-booting workers onto a
      # two-file shard, which is the memory profile that caused the OOM.
      VITEST_MIN_FORKS: "1"
      VITEST_MAX_FORKS: "4"
      VITEST_MIN_THREADS: "1"
      VITEST_MAX_THREADS: "4"
      # Is this shard's package in the cone? On a push to main `big3` is all
      # three, so every shard runs.
      #
      # The gate is on the STEPS, not on the job. A job-level `if:` cannot read
      # `matrix`, so it could only ever be all-nine-or-nothing; and the shard
      # jobs must keep reporting either way — a job skipped by an `if:` still
      # posts a conclusion, a job that was never generated posts nothing, and
      # the difference between those two is whether anything can merge. So the
      # matrix stays whole and each step opts out. A shard outside the cone
      # burns a few seconds of runner and reports green, having honestly run
      # nothing.
      # `heavy` is what takes the version PR out: it rewrites CHANGELOGs and
      # package.json versions, which puts every package in the cone and would
      # otherwise run all nine shards for nothing.
      RUN: ${{ needs.cone.outputs.heavy == 'true' && contains(needs.cone.outputs.big3, matrix.key) }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - if: env.RUN == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - if: env.RUN == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Turbo remote cache (GitHub-cache backed)
        if: env.RUN == 'true'
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      - if: env.RUN == 'true'
        run: pnpm install --frozen-lockfile
      # Within a package that IS in the cone there is no second, file-level
      # skip: every shard of it runs for real. #1139 is the reason — a
      # per-shard --affected probe let a docs-only PR skip every vendo shard and
      # merge green, and vendo-3 went red on main the moment it actually ran
      # (the docs-rot tests readFile docs-site/*.mdx, an input turbo's graph
      # does not know about). The package-level gate above has the same blind
      # spot by construction; what makes it survivable is the unfiltered run on
      # every push to main, which #1139 did not have.
      - name: Build deps
        if: env.RUN == 'true'
        run: pnpm turbo run build --filter=${{ matrix.pkg }}
      - name: tsc (store keeps its tsc-before-test contract)
        if: env.RUN == 'true' && matrix.tsc == 'true'
        run: pnpm --filter ${{ matrix.pkg }} exec tsc -p tsconfig.json
      # --reporter=default alongside blob: with blob as the SOLE reporter a
      # failing shard prints nothing about WHICH test failed, so a red shard
      # is undebuggable from the log alone.
      - name: Test shard
        if: env.RUN == 'true'
        run: pnpm --filter ${{ matrix.pkg }} exec vitest run --coverage --coverage.thresholds.lines=0 --reporter=default --reporter=blob --shard=${{ matrix.shard }}
      # always(): a failed shard must still upload its blob, or coverage-merge
      # merges a hole and reports a phantom coverage drop on top of the real
      # failure.
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        if: always() && env.RUN == 'true'
        with:
          name: blob-${{ matrix.name }}
          path: ${{ matrix.dir }}/.vitest-reports/
          # .vitest-reports is a dotted directory; upload-artifact drops hidden
          # files by default since v4.4 and the artifact would be empty.
          include-hidden-files: true
          retention-days: 1

  # Everything that is not one of the big three, as ONE job. It used to be two
  # matrix legs; on the last full main run they came in at 168s (group-b) and
  # 56s (group-a), so the split was buying ~56s of overlap at the cost of a
  # second runner, a second install and a second postgres container. Folded.
  # The filter is pure negation, so a new package joins CI the day it is
  # created without editing this file.
  #
  # $CONE narrows it to the cone. Verified, because it is the opposite of what
  # turbo's multi-filter behaviour looks like at first glance: repeated --filter
  # flags UNION, but --affected INTERSECTS with them.
  test-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: cone
    # Same reasoning as the shards' RUN gate: the version PR puts every package
    # in the cone and there is nothing here for it to prove.
    if: needs.cone.outputs.heavy == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vendo
          POSTGRES_PASSWORD: vendo
          POSTGRES_DB: vendo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URL: postgres://vendo:vendo@localhost:5432/vendo_test
      # Stays at 2, unlike the shards. This job runs turbo across many packages
      # at once, so its worker count is concurrency x pool — the two layers the
      # cap exists to stop multiplying. The shards have no outer layer and go
      # to 4.
      VITEST_MIN_FORKS: "1"
      VITEST_MAX_FORKS: "2"
      VITEST_MIN_THREADS: "1"
      VITEST_MAX_THREADS: "2"
      TURBO_SCM_BASE: ${{ needs.cone.outputs.base }}
      CONE: ${{ needs.cone.outputs.filter }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # turbo --affected diffs against the base branch
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Turbo remote cache (GitHub-cache backed)
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      - run: pnpm install --frozen-lockfile
      # Tripwire for the truncated-bundle flake (2026-08-16): pglite's 6MB wasm
      # bundle intermittently read back SHORT mid-job (`Invalid FS bundle size`),
      # and the writer is not in this repo — Node's readFile provably cannot
      # short-read a complete file, so the file itself was briefly truncated.
      # The store now boot-retries through it; these two stats exist so a
      # recurrence names the moment: short BEFORE tests = the pnpm store cache
      # restored a truncated entry (bust the cache key); good before + changed
      # inode/mtime after = something rewrote it during the run.
      - name: pglite bundle tripwire (before)
        run: stat -c '%n size=%s inode=%i links=%h mtime=%Y' node_modules/.pnpm/@electric-sql+pglite@*/node_modules/@electric-sql/pglite/dist/pglite.data
      # --continue so ONE red package cannot hide every other package's result;
      # --concurrency=2 bounds turbo's cross-package parallelism, and the
      # VITEST_MIN/MAX pair above bounds the SECOND layer (the worker pool
      # inside each package's vitest). Unbounded, the two layers multiply and
      # the live-Next-server suites flake (PR #340).
      - name: Test with coverage (PGlite + PostgreSQL)
        run: pnpm turbo run test:coverage --continue --concurrency=2 $CONE --filter=!@vendoai/vendo --filter=!@vendoai/store --filter=!@vendoai/ui
      - name: pglite bundle tripwire (after)
        if: always()
        run: stat -c '%n size=%s inode=%i links=%h mtime=%Y' node_modules/.pnpm/@electric-sql+pglite@*/node_modules/@electric-sql/pglite/dist/pglite.data

  # The OTHER AI SDK major (#478). Every other job in this file resolves ai@6 —
  # the version each package's devDependencies pin — so a peer range that claims
  # `ai >=6 <8` is a claim nothing checks. This lane pins the whole tree to the
  # v7 pairing and runs the same suites against it, which is the only way the
  # two live majors can disagree in front of anyone.
  #
  # SHARDED like test-shards, because unsharded it was the whole PR run's
  # critical path: 31 minutes against every other job's <=9 (main run
  # 32394860278), of which the serial test phase was 27m30s and @vendoai/vendo
  # alone was 1171s, ui 377s. Same split as the v6 lane — vendo x4, ui x2 — with
  # everything else in one `rest` leg, whose own long pole is @vendoai/agents at
  # 320s. `pnpm test:ai7` is still the one-shot a laptop runs; the three halves
  # of it are unrolled below so the last one can shard.
  #
  # It BUILDS first on purpose: every package compiles with tsc, so a v7 type
  # break fails here before a single test runs. The shard legs build only their
  # own closure; `rest` keeps the UNFILTERED build, so examples/ and fixtures/
  # are still type-checked against v7 somewhere. `store` is the one package with
  # no `ai` peer at all and three shards' worth of PGlite boots, so it is the one
  # negation; the rest is `./packages/*`, expressed that way so a new package
  # joins this lane the day it is created.
  #
  # NOT cached: the flipped lockfile hashes differently from every other job's,
  # so every leg is a cold run by construction. Parallelism is the entire win
  # here; there is no cache to chase.
  #
  # `test` only, never `test:ui` — no browser runs in CI (2026-08-06: headless
  # mis-resolves :focus-visible and light-dark()), and an SDK major is not a
  # pixel question anyway. The Playwright suite stays the local pre-PR gate it
  # is for the v6 lane.
  ai-dual:
    name: ai-dual (${{ matrix.name }})
    runs-on: ubuntu-latest
    # ~10 minutes of real work on the longest leg (install ~40s, build <=2m30s,
    # tests <=6m). A timeout is a hang detector, so the ceiling sits well above
    # that rather than at it.
    timeout-minutes: 25
    needs: cone
    # Same reasoning as the shards' RUN gate: the version PR puts every package
    # in the cone and there is nothing here for it to prove.
    if: needs.cone.outputs.heavy == 'true'
    env:
      # Both halves, at job level: this job invokes turbo directly, so it does
      # not inherit the root scripts' caps, and a max-only cap makes Tinypool
      # throw before a single test runs. Stays at 2 rather than test-shards' 4:
      # `rest` runs turbo across many packages, which is the outer layer the cap
      # exists to stop multiplying, and a cold v7 tree is the heaviest install
      # in the file.
      VITEST_MIN_FORKS: "1"
      VITEST_MAX_FORKS: "2"
      VITEST_MIN_THREADS: "1"
      VITEST_MAX_THREADS: "2"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: vendo-1, build: "--filter=@vendoai/vendo", test: "--filter=@vendoai/vendo exec vitest run --shard=1/4" }
          - { name: vendo-2, build: "--filter=@vendoai/vendo", test: "--filter=@vendoai/vendo exec vitest run --shard=2/4" }
          - { name: vendo-3, build: "--filter=@vendoai/vendo", test: "--filter=@vendoai/vendo exec vitest run --shard=3/4" }
          - { name: vendo-4, build: "--filter=@vendoai/vendo", test: "--filter=@vendoai/vendo exec vitest run --shard=4/4" }
          - { name: ui-1, build: "--filter=@vendoai/ui", test: "--filter=@vendoai/ui exec vitest run --shard=1/2" }
          - { name: ui-2, build: "--filter=@vendoai/ui", test: "--filter=@vendoai/ui exec vitest run --shard=2/2" }
          # No build filter = the whole tree; this is the leg that carries the
          # type-break guarantee above.
          - { name: rest, build: "", test: "turbo run test --continue --concurrency=2 '--filter=./packages/*' '--filter=!@vendoai/store' '--filter=!@vendoai/vendo' '--filter=!@vendoai/ui'" }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/pin-ai-major-7.mjs
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm turbo run build ${{ matrix.build }}
      - run: pnpm ${{ matrix.test }}

  # The per-package coverage floors (vendo 78 / store 84 / ui 90, each in the
  # package's vitest config) live HERE, because a floor is only meaningful
  # against the whole suite's coverage. vitest replays the shards' blob reports
  # without re-running a single test, then reports and enforces.
  #
  # PUSH TO MAIN ONLY. On a PR or a merge_group run the shards are the cone, so
  # the merged number is coverage-of-a-cone — a fraction that is not the floor
  # and cannot be compared to it. Enforcing it there would fail honest PRs and
  # teach everyone to ignore the check. main runs everything, so main is where
  # the number is real.
  coverage-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test-shards
    if: github.event_name == 'push' && always() && needs.test-shards.result != 'cancelled'
    # No turbo cache step: this job never invokes turbo — it replays blob
    # reports through vitest directly.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # continue-on-error: a shard that died before vitest ran (a red `Build
      # deps`) uploads no blob, and download-artifact treats a pattern that
      # matches nothing as an error — which would mask the real failure with a
      # download error. The merge step below skips that package instead.
      - name: Download vendo shard blobs
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: blob-vendo-*
          merge-multiple: true
          path: packages/vendo/.vitest-reports
      - name: Download store shard blobs
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: blob-store-*
          merge-multiple: true
          path: packages/store/.vitest-reports
      - name: Download ui shard blobs
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: blob-ui-*
          merge-multiple: true
          path: packages/ui/.vitest-reports
      - name: Merge shard reports and enforce coverage floors
        run: |
          for pkg in vendo store ui; do
            if [ -d "packages/$pkg/.vitest-reports" ]; then
              echo "::group::coverage merge — @vendoai/$pkg"
              pnpm --filter "@vendoai/$pkg" exec vitest run --merge-reports --coverage
              echo "::endgroup::"
            else
              echo "::warning::no shard blobs for @vendoai/$pkg — its shards failed before vitest ran, so those jobs are red and the ci check is too"
            fi
          done

  # The required check. Its name must stay `ci` (branch protection on main).
  #
  # Now that the lanes below it are cone-gated, SKIPPED is a normal, correct
  # outcome — coverage-merge skips on every PR, and the shards skip whenever
  # their package is outside the cone. GitHub's default `needs` semantics would
  # skip this job in turn and it would never report, so: `if: always()` to make
  # it run regardless, and explicit arithmetic below instead of leaning on
  # `needs`. Each need must be success OR skipped; anything else (failure,
  # cancelled) is red. Getting this backwards is the difference between
  # cone-only CI and no PR ever passing again, in either direction.
  ci:
    runs-on: ubuntu-latest
    needs: [cone, typecheck-lint, changeset-required, test-shards, test-rest, ai-dual, coverage-merge]
    if: always()
    steps:
      - name: All lanes green (skipped counts as success)
        env:
          # toJSON(needs), not toJSON(needs.*.result): the object form keeps the
          # job names, so a red run names the lane that failed.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<<"$NEEDS"
          bad=$(jq -r '
            to_entries
            | map(select(.value.result != "success" and .value.result != "skipped")
                  | "\(.key)=\(.value.result)")
            | join(", ")' <<<"$NEEDS")
          if [ -n "$bad" ]; then
            echo "::error::CI lanes not green: $bad"
            exit 1
          fi
          echo "all lanes green"

  # The integration suites, split five ways.
  #
  # This job WAS the whole run's critical path: 493s of a 507s full-suite wall
  # on main run 31930304532, nine suites end to end on one runner while eleven
  # other runners sat idle. The legs below are balanced on that run's measured
  # per-suite times, so the longest is ~143s of suite work instead of 432s.
  #
  # These legs are NOT the required check. The `integration` aggregate below is,
  # and it keeps that exact name — renaming it breaks merges.
  integration-legs:
    name: integration (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: cone
    # The version PR has no e2e surface; see the shards' RUN gate.
    if: needs.cone.outputs.heavy == 'true'
    services:
      # J9 (postgres-durability) runs the core journeys against real Postgres and
      # skips cleanly when POSTGRES_URL is unset; provisioning it here makes that
      # journey actually execute in CI. Kept on every leg rather than only the
      # two that need it today — a suite quietly losing its postgres leg is
      # exactly the kind of silent coverage loss this file keeps getting bitten
      # by, and the container costs ~20s against a 143s leg.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vendo
          POSTGRES_PASSWORD: vendo
          POSTGRES_DB: vendo_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URL: postgres://vendo:vendo@localhost:5432/vendo_integration
    strategy:
      fail-fast: false
      matrix:
        include:
          # Measured on run 31930304532: automations 130s | integration 113s +
          # demo-bank 30s | mcp 56s + redteam 54s | the four orphans 48s.
          #
          # `guarded` decides whether the --affected probe may skip the leg. The
          # orphans leg is UNGUARDED on purpose — see its comment below.
          - name: automations
            guarded: "true"
            build: "--filter=@vendoai-fixtures/automations-e2e..."
            suites: "@vendoai-fixtures/automations-e2e"
          - name: node
            guarded: "true"
            build: "--filter=@vendoai-fixtures/integration... --filter=demo-bank^..."
            suites: "@vendoai-fixtures/integration demo-bank"
          - name: doors
            guarded: "true"
            build: "--filter=@vendoai-fixtures/mcp-e2e... --filter=@vendoai/redteam-e2e..."
            suites: "@vendoai-fixtures/mcp-e2e @vendoai/redteam-e2e"
          # Four suites CI never executed before #1046. Each has a `test` script
          # and no `test:coverage`, so test-rest's turbo run passes over them and
          # no step named them — they ran only in release.yml's unfiltered
          # `pnpm test`, which is the worst possible place to first learn a suite
          # is red. Not hypothetical: the Express host's doctor e2e went red on
          # main when #989 tightened the /doctor/* mounting gate and stayed red
          # for hours, invisible to every PR, until a release dry run tripped
          # over it.
          #
          # UNGUARDED by the --affected probe, and deliberately still without a
          # `test:coverage` script, because both of those decide on turbo's
          # dependency graph and these suites' real inputs are not in it: they
          # read examples/ and corpus/ trees off disk and drive the CLI at the
          # repo root. A probe would skip exactly the PR that fixes one of them.
          # existing-agents-e2e is the sharpest case — #1001 added a
          # devDependency to examples/mastra-agent and left it red on main for
          # ~17h while every affected probe and cache key stayed clean.
          - name: orphans
            guarded: ""
            build: "--filter=@vendoai-corpus/express-host^... --filter=@vendoai-examples/ai-sdk-agent^... --filter=@vendoai-examples/mastra-agent^..."
            suites: "@vendoai-corpus/express-host @vendoai-examples/ai-sdk-agent @vendoai-examples/mastra-agent @vendoai-fixtures/existing-agents-e2e"
          # The install seam: pack the publish set, `pnpm add` the tarballs into
          # a stranger app in a temp dir, run the real CLI, boot it, and drive
          # one deterministic turn. Its own leg rather than a passenger on
          # `orphans` because it is the slowest of the always-on suites and a
          # leg of its own costs wall time only when it is the longest.
          #
          # UNGUARDED, for a sharper version of the orphans leg's reason: this
          # suite declares NO workspace dependency at all — it discovers the
          # publishable packages on disk and packs them — so `--affected` can
          # never mark it, and a probe would skip every PR including the one
          # that breaks the install.
          #
          # `vendoai...` is the whole publish set in one filter: the alias
          # depends on the umbrella, which depends on every other block. All
          # fourteen must carry a real dist/ before they are packed.
          - name: install-seam
            guarded: ""
            build: "--filter=vendoai..."
            suites: "@vendoai-fixtures/install-seam"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # turbo ls --affected diffs against the base branch
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Turbo remote cache (GitHub-cache backed)
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      - run: pnpm install --frozen-lockfile
      # `--affected` marks a package when it or ANY of its workspace deps
      # changed (verified: a one-line core edit marks every fixture and demo
      # here), so a skip hides nothing these suites could catch VIA THE
      # DEPENDENCY GRAPH — it is blind to inputs outside it, which is exactly how
      # test-shards greened a broken docs-rot suite. TURBO_SCM_BASE is explicit
      # because turbo's default base is the local branch `main`, which does not
      # exist on a PR checkout — without it, --affected silently reports
      # EVERYTHING affected. If the probe itself fails, we fall open into
      # running everything. `!= push` rather than `== pull_request` so the merge
      # queue gets the same treatment; only a push to main runs unconditionally.
      - name: Skip if this leg's scope is unaffected (PR and merge queue)
        id: affected
        if: matrix.guarded == 'true' && github.event_name != 'push'
        env:
          # pull_request: `main`. merge_group: `refs/heads/main`.
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
          SUITES: ${{ matrix.suites }}
        run: |
          export TURBO_SCM_BASE="origin/${BASE_REF#refs/heads/}"
          echo "cone base: $TURBO_SCM_BASE"
          if pnpm turbo ls --affected --output=json > /tmp/affected.json \
             && jq -r '.packages.items[].name' /tmp/affected.json | sort > /tmp/affected-names.txt; then
            hit=""
            for pkg in $SUITES; do
              if grep -qx "$pkg" /tmp/affected-names.txt; then hit="yes"; fi
            done
            if [ -z "$hit" ]; then
              echo "$SUITES unaffected by this change; skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      # Build only what this leg needs. `...` pulls a package's transitive
      # workspace deps; `demo-bank^...` builds demo-bank's deps without running
      # its Next build. The orphan leg's `^...` filters build workspace deps
      # only, never the examples' own `next build`, which nobody here needs —
      # those suites import the example's src/ directly.
      - name: Build this leg's workspace deps
        if: steps.affected.outputs.skip != 'true'
        run: pnpm turbo run build ${{ matrix.build }}
      # Sequential within the leg, not one parallel turbo run: each fixture
      # boots its own host-app dev server, and running them at once
      # oversubscribes the runner's CPUs.
      - name: Run this leg's suites
        if: steps.affected.outputs.skip != 'true'
        env:
          SUITES: ${{ matrix.suites }}
          # The live-agentic leg is the only suite that needs a real model. A
          # repository secret is not readable by a pull request from a fork, so
          # handing it out ONLY on a push to main (never a PR, never the merge
          # queue) is what keeps the key off a run a stranger can trigger — and
          # the suite's own `describe.skipIf` makes the empty string a clean
          # no-op everywhere else. Scoped to the automations leg because no
          # other leg has a live-model suite to unlock.
          ANTHROPIC_API_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.name == 'automations' && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          set -euo pipefail
          for pkg in $SUITES; do
            echo "::group::$pkg"
            pnpm --filter "$pkg" test
            echo "::endgroup::"
          done

  # The required check. Its name must stay `integration` (branch protection on
  # main). `cone` is in the needs on purpose: without it a failed cone job would
  # skip every leg, and all-skipped would read as green here.
  integration:
    runs-on: ubuntu-latest
    needs: [cone, integration-legs]
    if: always()
    steps:
      - name: All integration legs green (skipped counts as success)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<<"$NEEDS"
          bad=$(jq -r '
            to_entries
            | map(select(.value.result != "success" and .value.result != "skipped")
                  | "\(.key)=\(.value.result)")
            | join(", ")' <<<"$NEEDS")
          if [ -n "$bad" ]; then
            echo "::error::integration legs not green: $bad"
            exit 1
          fi
          echo "all integration legs green"

  conformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vendo
          POSTGRES_PASSWORD: vendo
          POSTGRES_DB: vendo_conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URL: postgres://vendo:vendo@localhost:5432/vendo_conformance
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # turbo ls --affected diffs against the base branch
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Turbo remote cache (GitHub-cache backed)
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      - run: pnpm install --frozen-lockfile
      # This job exercises exactly the three packages the root `conformance`
      # script covers. `--affected` includes dependents, so a change anywhere
      # beneath them still runs this job — see the integration job's skip step
      # for the TURBO_SCM_BASE and fall-open rationale.
      # `!= 'push'` so the merge queue gets the same cone treatment as a PR; see
      # the matching step in the integration job.
      - name: Skip if conformance scope unaffected (PR and merge queue)
        id: affected
        if: github.event_name != 'push'
        env:
          # pull_request: `main`. merge_group: `refs/heads/main`.
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title || github.event.merge_group.head_commit.message }}
        run: |
          # The version PR, same as the heavy jobs — but decided here rather than
          # taken from the cone job's output. This is a REQUIRED check, and a
          # `needs: cone` would let a failed cone SKIP it, which branch
          # protection reads as a pass.
          case "$HEAD_REF" in changeset-release/*)
            echo "changesets version PR; conformance skipped"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          case "$TITLE" in "chore: version packages"*)
            echo "changesets version PR; conformance skipped"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          export TURBO_SCM_BASE="origin/${BASE_REF#refs/heads/}"
          echo "cone base: $TURBO_SCM_BASE"
          if pnpm turbo ls --affected --output=json > /tmp/affected.json \
             && jq -e '[.packages.items[].name | select(IN(
                  "@vendoai/core",
                  "@vendoai/store",
                  "@vendoai/vendo"))] | length == 0' /tmp/affected.json > /dev/null; then
            echo "conformance scope unaffected by this PR; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.affected.outputs.skip != 'true'
        run: pnpm conformance

  # Supply-chain gate: fails on high/critical advisories in the PRODUCTION
  # dependency graph (what ships in the published tarballs). Scoped to --prod so
  # dev-tooling advisories (vitest/vite/esbuild dev servers) — which never ship
  # to consumers and are tracked by Renovate instead — do not gate releases.
  # --audit-level=high keeps the known moderate postcss finding (via the private
  # host-app fixture's Next.js) from reddening the gate. See renovate.json.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # npm permanently retired the legacy audit endpoints on 2026-07-15 (HTTP
      # 410); `pnpm audit` queries the replacement bulk-advisory endpoint from
      # pnpm 11 (pnpm/pnpm#11265), which the repo now pins via packageManager.
      #
      # 2026-07-26: registry.npmjs.org started serving the bulk-advisory
      # response gzip-compressed WITHOUT a Content-Encoding header, which pnpm
      # cannot decode — ERR_PNPM_AUDIT_BAD_RESPONSE on perfectly clean trees,
      # freezing every merge for hours. Real advisory findings still FAIL this
      # step; only that exact endpoint-infra signature degrades, after
      # retries, to a loud warning so a registry outage cannot block the
      # train while contributing zero security signal.
      - run: |
          for attempt in 1 2 3; do
            set +e
            pnpm audit --prod --audit-level high > /tmp/audit-out.txt 2>&1
            code=$?
            set -e
            tail -c 4000 /tmp/audit-out.txt | tr -d '\0' || true
            if [ "$code" -eq 0 ]; then exit 0; fi
            if ! grep -aq "ERR_PNPM_AUDIT_BAD_RESPONSE" /tmp/audit-out.txt; then
              exit "$code"
            fi
            echo "::warning::npm bulk-advisory endpoint returned an undecodable response (attempt $attempt); retrying"
            sleep 20
          done
          echo "::warning::npm bulk-advisory endpoint is broken (gzip without Content-Encoding, tracked 2026-07-26); audit is SKIPPED this run and gates again once the endpoint recovers"
