name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR supersedes the previous run; cancel it. Pushes to main
# never cancel each other (every main commit keeps its full record).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The old `ci` job did install → build → test:coverage (24 min) → typecheck →
# lint on ONE runner, ~30 min wall. It is now, all fanned out over the shared
# turbo remote cache so the fan-out does not multiply the build:
#   typecheck-lint    the non-test half
#   test-shards       9 intra-package vitest shards for the big three
#                     (vendo x4, store x3, ui x2 — 40 of the 55 serial minutes)
#   test-rest         the other 15 packages in 2 turbo groups
#   coverage-merge    merges the shards' blob reports and enforces the
#                     per-package coverage floors (they cannot be enforced on a
#                     single shard — see the comment on that job)
#   ci                aggregate; KEEPS the required-check name `ci`
# Required checks on main are: ci, integration, conformance, audit.
# Renaming any of those job names breaks merges.
#
# No browser runs here (Yousef's call, 2026-08-06): headless CI mis-resolves
# :focus-visible and light-dark(), so the Playwright suites were a slow gate
# that could not judge the thing they were watching. They stay the LOCAL
# pre-PR gate — `pnpm --filter @vendoai/ui test:browser` and
# `pnpm --filter @vendoai-fixtures/integration-browser test:browser` — under
# the UI-LAW browser-verification step.
jobs:
  typecheck-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Turbo remote cache (GitHub-cache backed)
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint

  # The big three, split file-wise inside each package. Coverage is collected
  # per shard as a BLOB report and merged in coverage-merge; the per-shard runs
  # pass --coverage.thresholds.lines=0 because vitest enforces the package's
  # floor against whatever that shard happened to cover (measured back when a
  # `kit` package still existed: its shard 1/2 reported 48% of the 94% the whole
  # suite reaches, and a floor of 90 fails the shard). Zeroing it here moves the
  # floor to the merge, where the number is the real one — the gate is not
  # weakened, it is moved to the only place it can be correct.
  test-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vendo
          POSTGRES_PASSWORD: vendo
          POSTGRES_DB: vendo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          # 4 shards, not 3: vitest deals files by count, not duration, and at
          # 3 the full-stack suites clustered on shard 2 (7m25s vs its
          # siblings' ~4m45s — measured on the #849 proof run), making it tie
          # integration as the whole run's critical path.
          - { name: vendo-1, pkg: "@vendoai/vendo", dir: packages/vendo, shard: "1/4" }
          - { name: vendo-2, pkg: "@vendoai/vendo", dir: packages/vendo, shard: "2/4" }
          - { name: vendo-3, pkg: "@vendoai/vendo", dir: packages/vendo, shard: "3/4" }
          - { name: vendo-4, pkg: "@vendoai/vendo", dir: packages/vendo, shard: "4/4" }
          - { name: store-1, pkg: "@vendoai/store", dir: packages/store, shard: "1/3", tsc: "true" }
          - { name: store-2, pkg: "@vendoai/store", dir: packages/store, shard: "2/3", tsc: "true" }
          - { name: store-3, pkg: "@vendoai/store", dir: packages/store, shard: "3/3", tsc: "true" }
          - { name: ui-1, pkg: "@vendoai/ui", dir: packages/ui, shard: "1/2", pre: "build:jail" }
          - { name: ui-2, pkg: "@vendoai/ui", dir: packages/ui, shard: "2/2", pre: "build:jail" }
    env:
      POSTGRES_URL: postgres://vendo:vendo@localhost:5432/vendo_test
      VITEST_MIN_FORKS: "1"
      VITEST_MAX_FORKS: "2"
      VITEST_MIN_THREADS: "1"
      VITEST_MAX_THREADS: "2"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # turbo --affected diffs against the base branch
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Turbo remote cache (GitHub-cache backed)
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      - run: pnpm install --frozen-lockfile
      # TURBO_SCM_BASE is explicit: turbo's default base is the local branch
      # `main`, which does not exist on a PR checkout (and is stale in a
      # worktree), so without it --affected silently reports EVERYTHING
      # affected — verified locally: 74 tasks vs the correct 0.
      - name: Skip if package unaffected (PRs only)
        id: affected
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
        run: |
          if pnpm turbo run test:coverage --filter=${{ matrix.pkg }} --affected --dry=json > /tmp/dry.json \
             && jq -e '.tasks | length == 0' /tmp/dry.json > /dev/null; then
            echo "${{ matrix.pkg }} is unaffected by this PR; skipping shard ${{ matrix.shard }}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build deps
        if: steps.affected.outputs.skip != 'true'
        run: pnpm turbo run build --filter=${{ matrix.pkg }}
      # The package's own pretest hook does not run here (we invoke vitest
      # directly, to pass --shard), and a turbo cache HIT on `build` skips the
      # prebuild hook that would otherwise produce these. So do it explicitly.
      - name: Pre-step
        if: steps.affected.outputs.skip != 'true' && matrix.pre
        run: pnpm --filter ${{ matrix.pkg }} run ${{ matrix.pre }}
      - name: tsc (store keeps its tsc-before-test contract)
        if: steps.affected.outputs.skip != 'true' && matrix.tsc == 'true'
        run: pnpm --filter ${{ matrix.pkg }} exec tsc -p tsconfig.json
      # --reporter=default alongside blob: with blob as the SOLE reporter a
      # failing shard prints nothing about WHICH test failed, so a red shard
      # is undebuggable from the log alone.
      - name: Test shard
        if: steps.affected.outputs.skip != 'true'
        run: pnpm --filter ${{ matrix.pkg }} exec vitest run --coverage --coverage.thresholds.lines=0 --reporter=default --reporter=blob --shard=${{ matrix.shard }}
      # always(): a failed shard must still upload its blob, or coverage-merge
      # merges a hole and reports a phantom coverage drop on top of the real
      # failure.
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        if: always() && steps.affected.outputs.skip != 'true'
        with:
          name: blob-${{ matrix.name }}
          path: ${{ matrix.dir }}/.vitest-reports/
          # .vitest-reports is a dotted directory; upload-artifact drops hidden
          # files by default since v4.4 and the artifact would be empty.
          include-hidden-files: true
          retention-days: 1

  # Everything that is not one of the big three. No --affected skip step here:
  # turbo's remote cache IS the skip — an unchanged package's test:coverage
  # replays from cache in seconds. group-b is expressed as negations so a new
  # package joins CI the day it is created, without editing this file.
  test-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vendo
          POSTGRES_PASSWORD: vendo
          POSTGRES_DB: vendo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: group-a, filters: "--filter=@vendoai/guard --filter=@vendoai/actions" }
          - { name: group-b, filters: "--filter=!@vendoai/vendo --filter=!@vendoai/store --filter=!@vendoai/ui --filter=!@vendoai/guard --filter=!@vendoai/actions" }
    env:
      POSTGRES_URL: postgres://vendo:vendo@localhost:5432/vendo_test
      VITEST_MIN_FORKS: "1"
      VITEST_MAX_FORKS: "2"
      VITEST_MIN_THREADS: "1"
      VITEST_MAX_THREADS: "2"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Turbo remote cache (GitHub-cache backed)
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      - run: pnpm install --frozen-lockfile
      # --continue so ONE red package cannot hide every other package's result;
      # --concurrency=2 bounds turbo's cross-package parallelism, and the
      # VITEST_MIN/MAX pair above bounds the SECOND layer (the worker pool
      # inside each package's vitest). Unbounded, the two layers multiply and
      # the live-Next-server suites flake (PR #340).
      - name: Test with coverage (PGlite + PostgreSQL)
        run: pnpm turbo run test:coverage --continue --concurrency=2 ${{ matrix.filters }}

  # The per-package coverage floors (vendo 78 / store 84 / ui 90, each in the
  # package's vitest config) live HERE, because a floor is only meaningful
  # against the whole suite's coverage. vitest replays the shards' blob reports
  # without re-running a single test, then reports and enforces.
  coverage-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test-shards
    if: always() && needs.test-shards.result != 'cancelled'
    # No turbo cache step: this job never invokes turbo — it replays blob
    # reports through vitest directly.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # continue-on-error: a package whose shards all skipped (unaffected) has
      # no artifacts, and download-artifact treats a pattern that matches
      # nothing as an error. The merge step below skips that package instead.
      - name: Download vendo shard blobs
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: blob-vendo-*
          merge-multiple: true
          path: packages/vendo/.vitest-reports
      - name: Download store shard blobs
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: blob-store-*
          merge-multiple: true
          path: packages/store/.vitest-reports
      - name: Download ui shard blobs
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: blob-ui-*
          merge-multiple: true
          path: packages/ui/.vitest-reports
      - name: Merge shard reports and enforce coverage floors
        run: |
          for pkg in vendo store ui; do
            if [ -d "packages/$pkg/.vitest-reports" ]; then
              echo "::group::coverage merge — @vendoai/$pkg"
              pnpm --filter "@vendoai/$pkg" exec vitest run --merge-reports --coverage
              echo "::endgroup::"
            else
              echo "no shard blobs for @vendoai/$pkg (unaffected by this PR); nothing to merge"
            fi
          done

  # The required check. Its name must stay `ci` (branch protection on main).
  ci:
    runs-on: ubuntu-latest
    needs: [typecheck-lint, test-shards, test-rest, coverage-merge]
    if: always()
    steps:
      - name: All lanes green
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          [[ "$RESULTS" != *failure* && "$RESULTS" != *cancelled* ]]

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # J9 (postgres-durability) runs the core journeys against real Postgres and
      # skips cleanly when POSTGRES_URL is unset; provisioning it here makes that
      # journey actually execute in CI.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vendo
          POSTGRES_PASSWORD: vendo
          POSTGRES_DB: vendo_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URL: postgres://vendo:vendo@localhost:5432/vendo_integration
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # turbo ls --affected diffs against the base branch
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Turbo remote cache (GitHub-cache backed)
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      - run: pnpm install --frozen-lockfile
      # Four suites CI never executed. Each has a `test` script and no
      # `test:coverage`, so test-rest's turbo run passes over them and no step
      # named them — they ran only in release.yml's unfiltered `pnpm test`,
      # which is the worst possible place to first learn a suite is red. That is
      # not hypothetical: the Express host's doctor e2e went red on main when
      # #989 tightened the /doctor/* mounting gate and stayed red for hours,
      # invisible to every PR, until a release dry run tripped over it (#1046).
      #
      # UNGUARDED by the skip probe below, and deliberately still without a
      # `test:coverage` script, because both of those decide on turbo's
      # dependency graph and these suites' real inputs are not in it: they read
      # examples/ and corpus/ trees off disk and drive the CLI at the repo root.
      # A probe would therefore skip exactly the PR that fixes one of them.
      #
      # They are invoked per package rather than through `turbo run test`, which
      # would also run each example's own `build` — a full `next build` nobody
      # needs, since these suites import the example's `src/` directly and need
      # only their workspace deps built. That is what the `^...` step below
      # builds (14 tasks, replayed from the remote cache that typecheck-lint's
      # `pnpm build` fills). Sequential steps, not one parallel turbo run, for
      # the same reason as the redteam/automations steps further down. All four
      # are hermetic — scripted models, temp PGlite stores, no network, no keys;
      # ai-sdk-agent's two live journeys self-skip without a key, as do
      # existing-agents-e2e's two (VENDO_LIVE_JOURNEY=1).
      - name: Build the orphan suites' workspace deps (no example builds)
        run: pnpm turbo run build --filter=@vendoai-corpus/express-host^... --filter=@vendoai-examples/ai-sdk-agent^... --filter=@vendoai-examples/mastra-agent^...
      # The Express corpus host: six e2e that boot the real relay on loopback
      # over real HTTP (status, chat-tool, approvals, generated view, the fetch
      # adapter, and `vendo doctor` against the running wire).
      - run: pnpm --filter @vendoai-corpus/express-host test
      # The AI SDK example's four-touch diff: guarded action, generated UI,
      # approvals. The two cloud-posture journeys gate on a live key and skip.
      - run: pnpm --filter @vendoai-examples/ai-sdk-agent test
      # The Mastra example's SEAM suite — a real Mastra Agent turn parking a
      # risky tool call, approving it over the wire, and executing the real
      # handler, against the example's own composeVendo and checked-in
      # .vendo/tools.json. Added by #1001 and never once run in CI until now.
      - run: pnpm --filter @vendoai-examples/mastra-agent test
      # The fourth, and the one that motivated the rest: the BYO-agent
      # marked-diff contract, which derives each example's pre-Vendo starter and
      # round-trips the marked diff back. Same rationale as above, and the
      # sharpest case of it — #1001 added a devDependency to
      # examples/mastra-agent and left this suite red on main for ~17h while
      # every affected probe and cache key stayed clean. Needs no build of its
      # own (it reads the example trees as text), so it is not in the `^...`
      # filter above; ~3s.
      - run: pnpm --filter @vendoai-fixtures/existing-agents-e2e test
      # Same skip contract as test-shards: `--affected` marks a package when it
      # or ANY of its workspace deps changed (verified: a one-line core edit
      # marks every fixture and demo below), so a skip here can never hide a
      # change these suites could catch. TURBO_SCM_BASE is explicit for the
      # same reason as in test-shards — turbo's default base is the local
      # `main`, absent on a PR checkout. If the probe itself fails, we fall
      # open into running everything.
      - name: Skip if e2e scope unaffected (PRs only)
        id: affected
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
        run: |
          if pnpm turbo ls --affected --output=json > /tmp/affected.json \
             && jq -e '[.packages.items[].name | select(IN(
                  "@vendoai-fixtures/integration",
                  "@vendoai-fixtures/mcp-e2e",
                  "@vendoai/redteam-e2e",
                  "@vendoai-fixtures/automations-e2e",
                  "demo-bank"))] | length == 0' /tmp/affected.json > /dev/null; then
            echo "integration scope unaffected by this PR; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # Build only the workspace deps the integration suites need (the `...`
      # suffix pulls each fixture package's transitive workspace deps;
      # `demo-bank^...` builds demo-bank's deps without running its Next build).
      - if: steps.affected.outputs.skip != 'true'
        run: pnpm turbo run build --filter=@vendoai-fixtures/integration... --filter=@vendoai-fixtures/mcp-e2e... --filter=@vendoai/redteam-e2e... --filter=@vendoai-fixtures/automations-e2e... --filter=demo-bank^...
      # The node suite boots the real composed umbrella over HTTP against the host app.
      - if: steps.affected.outputs.skip != 'true'
        run: pnpm --filter @vendoai-fixtures/integration test
      # The MCP door e2e suite: its multi-instance token-claim race test
      # (token-claim-race.e2e.test.ts, the ENG-270 single-use-token guarantee)
      # gates on POSTGRES_URL and otherwise silently skips — the job-level
      # POSTGRES_URL above makes it actually run its forced-overlap races here.
      - if: steps.affected.outputs.skip != 'true'
        run: pnpm --filter @vendoai-fixtures/mcp-e2e test
      # The offline security corpus (PR #123): prompt-injection, oauth-csrf,
      # artifact/away-authority, shared-app-dormant, smoke. Mock-model and
      # key-free; the live-egress legs are run on demand. Each fixture boots its
      # own host-app dev server on an ephemeral port with a per-suite dist dir,
      # so these steps are safe to run back to back on one runner; they stay
      # sequential steps (not turbo-parallel) to avoid oversubscribing CPUs.
      - if: steps.affected.outputs.skip != 'true'
        run: pnpm --filter @vendoai/redteam-e2e test
      # Automations governance e2e: kill-switch, emit-and-revoke, park-resume,
      # webhook, schedules, observability, steps-pipeline (live-* legs run on
      # demand).
      - if: steps.affected.outputs.skip != 'true'
        run: pnpm --filter @vendoai-fixtures/automations-e2e test
      # Maple's suite (auth, away drill, transfers, money, mcp-config, server
      # routes). demo apps define no test:coverage script, so the test-rest job's
      # turbo run skips them — this is demo-bank's only CI execution.
      - if: steps.affected.outputs.skip != 'true'
        run: pnpm --filter demo-bank test

  conformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vendo
          POSTGRES_PASSWORD: vendo
          POSTGRES_DB: vendo_conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URL: postgres://vendo:vendo@localhost:5432/vendo_conformance
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # turbo ls --affected diffs against the base branch
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Turbo remote cache (GitHub-cache backed)
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      - run: pnpm install --frozen-lockfile
      # This job exercises exactly the three packages the root `conformance`
      # script covers. `--affected` includes dependents, so a change anywhere
      # beneath them still runs this job — see the integration job's skip step
      # for the TURBO_SCM_BASE and fall-open rationale.
      - name: Skip if conformance scope unaffected (PRs only)
        id: affected
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
        run: |
          if pnpm turbo ls --affected --output=json > /tmp/affected.json \
             && jq -e '[.packages.items[].name | select(IN(
                  "@vendoai/core",
                  "@vendoai/store",
                  "@vendoai/agent"))] | length == 0' /tmp/affected.json > /dev/null; then
            echo "conformance scope unaffected by this PR; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.affected.outputs.skip != 'true'
        run: pnpm conformance

  # Supply-chain gate: fails on high/critical advisories in the PRODUCTION
  # dependency graph (what ships in the published tarballs). Scoped to --prod so
  # dev-tooling advisories (vitest/vite/esbuild dev servers) — which never ship
  # to consumers and are tracked by Renovate instead — do not gate releases.
  # --audit-level=high keeps the known moderate postcss finding (via the private
  # host-app fixture's Next.js) from reddening the gate. See renovate.json.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # npm permanently retired the legacy audit endpoints on 2026-07-15 (HTTP
      # 410); `pnpm audit` queries the replacement bulk-advisory endpoint from
      # pnpm 11 (pnpm/pnpm#11265), which the repo now pins via packageManager.
      #
      # 2026-07-26: registry.npmjs.org started serving the bulk-advisory
      # response gzip-compressed WITHOUT a Content-Encoding header, which pnpm
      # cannot decode — ERR_PNPM_AUDIT_BAD_RESPONSE on perfectly clean trees,
      # freezing every merge for hours. Real advisory findings still FAIL this
      # step; only that exact endpoint-infra signature degrades, after
      # retries, to a loud warning so a registry outage cannot block the
      # train while contributing zero security signal.
      - run: |
          for attempt in 1 2 3; do
            set +e
            pnpm audit --prod --audit-level high > /tmp/audit-out.txt 2>&1
            code=$?
            set -e
            tail -c 4000 /tmp/audit-out.txt | tr -d '\0' || true
            if [ "$code" -eq 0 ]; then exit 0; fi
            if ! grep -aq "ERR_PNPM_AUDIT_BAD_RESPONSE" /tmp/audit-out.txt; then
              exit "$code"
            fi
            echo "::warning::npm bulk-advisory endpoint returned an undecodable response (attempt $attempt); retrying"
            sleep 20
          done
          echo "::warning::npm bulk-advisory endpoint is broken (gzip without Content-Encoding, tracked 2026-07-26); audit is SKIPPED this run and gates again once the endpoint recovers"
