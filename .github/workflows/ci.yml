name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The old `ci` job did install → build → test:coverage (24 min) → typecheck →
# lint on ONE runner, ~30 min wall. It is now, all fanned out over the shared
# turbo remote cache so the fan-out does not multiply the build:
#   typecheck-lint    the non-test half
#   test-shards       8 intra-package vitest shards for the big three
#                     (vendo x3, store x3, ui x2 — 40 of the 55 serial minutes)
#   test-rest         the other 15 packages in 2 turbo groups
#   coverage-merge    merges the shards' blob reports and enforces the
#                     per-package coverage floors (they cannot be enforced on a
#                     single shard — see the comment on that job)
#   hermetic-extras   the suites that were never in CI at all
#   ci                aggregate; KEEPS the required-check name `ci`
# Required checks on main are: ci, integration, perf, conformance, audit.
# Renaming any of those job names breaks merges.
jobs:
  typecheck-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Turbo remote cache (GitHub-cache backed)
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint

  # The big three, split file-wise inside each package. Coverage is collected
  # per shard as a BLOB report and merged in coverage-merge; the per-shard runs
  # pass --coverage.thresholds.lines=0 because vitest enforces the package's
  # floor against whatever that shard happened to cover (measured: kit's
  # shard 1/2 reports 48% of the 94% the whole suite reaches, and a floor of 90
  # fails the shard). Zeroing it here moves the floor to the merge, where the
  # number is the real one — the gate is not weakened, it is moved to the only
  # place it can be correct.
  test-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vendo
          POSTGRES_PASSWORD: vendo
          POSTGRES_DB: vendo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: vendo-1, pkg: "@vendoai/vendo", dir: packages/vendo, shard: "1/3", pre: "build:playground" }
          - { name: vendo-2, pkg: "@vendoai/vendo", dir: packages/vendo, shard: "2/3", pre: "build:playground" }
          - { name: vendo-3, pkg: "@vendoai/vendo", dir: packages/vendo, shard: "3/3", pre: "build:playground" }
          - { name: store-1, pkg: "@vendoai/store", dir: packages/store, shard: "1/3", tsc: "true" }
          - { name: store-2, pkg: "@vendoai/store", dir: packages/store, shard: "2/3", tsc: "true" }
          - { name: store-3, pkg: "@vendoai/store", dir: packages/store, shard: "3/3", tsc: "true" }
          - { name: ui-1, pkg: "@vendoai/ui", dir: packages/ui, shard: "1/2", pre: "build:jail" }
          - { name: ui-2, pkg: "@vendoai/ui", dir: packages/ui, shard: "2/2", pre: "build:jail" }
    env:
      POSTGRES_URL: postgres://vendo:vendo@localhost:5432/vendo_test
      VITEST_MIN_FORKS: "1"
      VITEST_MAX_FORKS: "2"
      VITEST_MIN_THREADS: "1"
      VITEST_MAX_THREADS: "2"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # turbo --affected diffs against the base branch
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Turbo remote cache (GitHub-cache backed)
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      - run: pnpm install --frozen-lockfile
      # TURBO_SCM_BASE is explicit: turbo's default base is the local branch
      # `main`, which does not exist on a PR checkout (and is stale in a
      # worktree), so without it --affected silently reports EVERYTHING
      # affected — verified locally: 74 tasks vs the correct 0.
      - name: Skip if package unaffected (PRs only)
        id: affected
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
        run: |
          if pnpm turbo run test:coverage --filter=${{ matrix.pkg }} --affected --dry=json > /tmp/dry.json \
             && jq -e '.tasks | length == 0' /tmp/dry.json > /dev/null; then
            echo "${{ matrix.pkg }} is unaffected by this PR; skipping shard ${{ matrix.shard }}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build deps
        if: steps.affected.outputs.skip != 'true'
        run: pnpm turbo run build --filter=${{ matrix.pkg }}
      # The package's own pretest hook does not run here (we invoke vitest
      # directly, to pass --shard), and a turbo cache HIT on `build` skips the
      # prebuild hook that would otherwise produce these. So do it explicitly.
      - name: Pre-step
        if: steps.affected.outputs.skip != 'true' && matrix.pre
        run: pnpm --filter ${{ matrix.pkg }} run ${{ matrix.pre }}
      - name: tsc (store keeps its tsc-before-test contract)
        if: steps.affected.outputs.skip != 'true' && matrix.tsc == 'true'
        run: pnpm --filter ${{ matrix.pkg }} exec tsc -p tsconfig.json
      - name: Test shard
        if: steps.affected.outputs.skip != 'true'
        run: pnpm --filter ${{ matrix.pkg }} exec vitest run --coverage --coverage.thresholds.lines=0 --reporter=blob --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        if: steps.affected.outputs.skip != 'true'
        with:
          name: blob-${{ matrix.name }}
          path: ${{ matrix.dir }}/.vitest-reports/
          # .vitest-reports is a dotted directory; upload-artifact drops hidden
          # files by default since v4.4 and the artifact would be empty.
          include-hidden-files: true
          retention-days: 1

  # Everything that is not one of the big three. No --affected skip step here:
  # turbo's remote cache IS the skip — an unchanged package's test:coverage
  # replays from cache in seconds. group-b is expressed as negations so a new
  # package joins CI the day it is created, without editing this file.
  test-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vendo
          POSTGRES_PASSWORD: vendo
          POSTGRES_DB: vendo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: group-a, filters: "--filter=@vendoai/guard --filter=@vendoai/actions" }
          - { name: group-b, filters: "--filter=!@vendoai/vendo --filter=!@vendoai/store --filter=!@vendoai/ui --filter=!@vendoai/guard --filter=!@vendoai/actions" }
    env:
      POSTGRES_URL: postgres://vendo:vendo@localhost:5432/vendo_test
      VITEST_MIN_FORKS: "1"
      VITEST_MAX_FORKS: "2"
      VITEST_MIN_THREADS: "1"
      VITEST_MAX_THREADS: "2"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Turbo remote cache (GitHub-cache backed)
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      - run: pnpm install --frozen-lockfile
      # --continue so ONE red package cannot hide every other package's result;
      # --concurrency=2 bounds turbo's cross-package parallelism, and the
      # VITEST_MIN/MAX pair above bounds the SECOND layer (the worker pool
      # inside each package's vitest). Unbounded, the two layers multiply and
      # the live-Next-server suites flake (PR #340).
      - name: Test with coverage (PGlite + PostgreSQL)
        run: pnpm turbo run test:coverage --continue --concurrency=2 ${{ matrix.filters }}

  # The per-package coverage floors (vendo 78 / store 84 / ui 74, each in the
  # package's vitest config) live HERE, because a floor is only meaningful
  # against the whole suite's coverage. vitest replays the shards' blob reports
  # without re-running a single test, then reports and enforces.
  coverage-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test-shards
    if: always() && needs.test-shards.result != 'cancelled'
    # No turbo cache step: this job never invokes turbo — it replays blob
    # reports through vitest directly.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # continue-on-error: a package whose shards all skipped (unaffected) has
      # no artifacts, and download-artifact treats a pattern that matches
      # nothing as an error. The merge step below skips that package instead.
      - name: Download vendo shard blobs
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: blob-vendo-*
          merge-multiple: true
          path: packages/vendo/.vitest-reports
      - name: Download store shard blobs
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: blob-store-*
          merge-multiple: true
          path: packages/store/.vitest-reports
      - name: Download ui shard blobs
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: blob-ui-*
          merge-multiple: true
          path: packages/ui/.vitest-reports
      - name: Merge shard reports and enforce coverage floors
        run: |
          for pkg in vendo store ui; do
            if [ -d "packages/$pkg/.vitest-reports" ]; then
              echo "::group::coverage merge — @vendoai/$pkg"
              pnpm --filter "@vendoai/$pkg" exec vitest run --merge-reports --coverage
              echo "::endgroup::"
            else
              echo "no shard blobs for @vendoai/$pkg (unaffected by this PR); nothing to merge"
            fi
          done

  # Three suites that existed, passed locally, and ran NOWHERE in CI: both
  # framework integration examples and the corpus express host. All hermetic — scripted models, temp PGlite,
  # no keys. They define `test` and not `test:coverage`, which is exactly why
  # the old ci job's `turbo run test:coverage` never touched them.
  # ai-sdk-agent's cloud-posture.e2e.test.ts self-skips without
  # VENDO_LIVE_CLOUD=1; it stays skipped here (it is a nightly-class live test).
  hermetic-extras:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITEST_MIN_FORKS: "1"
      VITEST_MAX_FORKS: "2"
      VITEST_MIN_THREADS: "1"
      VITEST_MAX_THREADS: "2"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Turbo remote cache (GitHub-cache backed)
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      - run: pnpm install --frozen-lockfile
      # No separate build step: turbo.json gives `test` dependsOn
      # ["^build", "build"], so this one command builds the three packages and
      # their workspace deps before running them.
      - name: Test formerly-local-only suites
        run: pnpm turbo run test --continue --concurrency=2 --filter=@vendoai-examples/ai-sdk-agent --filter=@vendoai-examples/mastra-agent --filter=@vendoai-corpus/express-host

  # The required check. Its name must stay `ci` (branch protection on main).
  ci:
    runs-on: ubuntu-latest
    needs: [typecheck-lint, test-shards, test-rest, coverage-merge, hermetic-extras]
    if: always()
    steps:
      - name: All lanes green
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          [[ "$RESULTS" != *failure* && "$RESULTS" != *cancelled* ]]

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # J9 (postgres-durability) runs the core journeys against real Postgres and
      # skips cleanly when POSTGRES_URL is unset; provisioning it here makes that
      # journey actually execute in CI.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vendo
          POSTGRES_PASSWORD: vendo
          POSTGRES_DB: vendo_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URL: postgres://vendo:vendo@localhost:5432/vendo_integration
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Turbo remote cache (GitHub-cache backed)
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      - run: pnpm install --frozen-lockfile
      # Build only the workspace deps the integration suites need (the `...`
      # suffix pulls each fixture package's transitive workspace deps;
      # `demo-bank^...` builds demo-bank's deps without running its Next build).
      - run: pnpm turbo run build --filter=@vendoai-fixtures/integration... --filter=@vendoai-fixtures/integration-browser... --filter=@vendoai-fixtures/mcp-e2e... --filter=@vendoai/redteam-e2e... --filter=@vendoai-fixtures/automations-e2e... --filter=@vendoai-fixtures/chat-e2e... --filter=demo-bank^...
      # The node suite boots the real composed umbrella over HTTP against the host app.
      - run: pnpm --filter @vendoai-fixtures/integration test
      # The MCP door e2e suite: its multi-instance token-claim race test
      # (token-claim-race.e2e.test.ts, the ENG-270 single-use-token guarantee)
      # gates on POSTGRES_URL and otherwise silently skips — the job-level
      # POSTGRES_URL above makes it actually run its forced-overlap races here.
      - run: pnpm --filter @vendoai-fixtures/mcp-e2e test
      # The offline security corpus (PR #123): prompt-injection, oauth-csrf,
      # artifact/away-authority, shared-app-dormant, smoke. Mock-model and
      # key-free; the live-egress legs stay on nightly. Each fixture boots its
      # own host-app dev server on an ephemeral port with a per-suite dist dir,
      # so these steps are safe to run back to back on one runner; they stay
      # sequential steps (not turbo-parallel) to avoid oversubscribing CPUs.
      - run: pnpm --filter @vendoai/redteam-e2e test
      # Automations governance e2e: kill-switch, emit-and-revoke, park-resume,
      # webhook, schedules, observability, steps-pipeline (live-* legs are
      # nightly's).
      - run: pnpm --filter @vendoai-fixtures/automations-e2e test
      # Chat governance/approval e2e: approval-roundtrip, away-runner, blocked,
      # deny, ephemeral, grant-drift, thread-scoping. Own PGlite per test, no
      # shared server.
      - run: pnpm --filter @vendoai-fixtures/chat-e2e test
      # Maple's suite (auth, away drill, transfers, money, mcp-config, server
      # routes). demo apps define no test:coverage script, so the test-rest job's
      # turbo run skips them — this is demo-bank's only CI execution (Cadence
      # gets the cadence-supabase-auth job).
      - run: pnpm --filter demo-bank test
      # The browser leg drives the shipped hooks/chrome in Chromium against the same wire.
      - run: pnpm --filter @vendoai-fixtures/integration-browser exec playwright install --with-deps chromium
      - run: pnpm --filter @vendoai-fixtures/integration-browser test:browser
      - if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: integration-browser-playwright-trace
          path: fixtures/integration-browser/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  conformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vendo
          POSTGRES_PASSWORD: vendo
          POSTGRES_DB: vendo_conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URL: postgres://vendo:vendo@localhost:5432/vendo_conformance
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Turbo remote cache (GitHub-cache backed)
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm conformance
      # Vite's generated bundle differs byte-for-byte between macOS and Linux,
      # so freshness cannot be enforced with a cross-platform source diff. The
      # checked-in artifact is instead exercised through its real browser wire.
      - run: pnpm --filter @vendoai/ui exec playwright install --with-deps chromium
      - name: MCP Apps shim semantic contract
        run: pnpm --filter @vendoai/ui test:mcp-shim
      # ENG-231 — the permanent solidity + stress gate over the localhost wire
      # fixture: the stress spec (mid-stream kill, phone viewports, rapid
      # open/close, multi-turn persistence, concurrent surfaces, dark-brand)
      # plus the solidity axes it consolidates — long threads, scroll +
      # jump-to-latest, theme-token effectiveness / dark derivation, the bounded
      # height chain. Scoped to this CI-hardened set on purpose: the axe / keyboard /
      # screenshot / raw-interaction legacy specs stay the LOCAL pre-PR gate
      # (per the UI-LAW browser-verification step) because headless CI mis-
      # resolves :focus-visible outlines and light-dark(), which those specs
      # assert directly. The full suite still runs locally via `test:browser`.
      # `test:browser` (not `exec playwright test`) so the pretest:browser hook
      # builds the gitignored jail runtime first; extra args pass through to
      # playwright as the file list.
      #
      # The consumer-voice family joins them (post-check checklist 11): those
      # specs are what keeps a developer's sentence — an env var, a raw
      # exception, a status slug, a wire reason — off a person's screen, and
      # every one of them was running nowhere. `build-failed-banner` was RED on
      # its own branch for exactly that reason. They stub their doors with
      # page.route and assert text, so nothing in them depends on the
      # :focus-visible / light-dark() resolution that keeps the legacy specs
      # local.
      #
      # Post-check round 2 additions, and why each one is here:
      #   accessibility     the paragraph above lumped "axe" in with the
      #                     :focus-visible specs. That was never true of it —
      #                     it is eleven pure axe sweeps over the chrome and
      #                     asserts no outline and no light-dark() anywhere.
      #   center-a11y       the durable half of postcheck-b's one-shot proof
      #                     script, which lived under docs/ outside `testDir`
      #                     and so could never catch a regression. It is also
      #                     the only CI home of four BROWSER-ONLY mechanisms
      #                     the wave otherwise pinned in jsdom alone: `inert`
      #                     (H11/H12), real focus order (H10/H18/M34),
      #                     IntersectionObserver (H16) and contrast (M33).
      #   approvals-poller  H15's ~20s request COUNT. Eventual consistency —
      #                     what the smoke pack checks — is also what three
      #                     independent pollers give you; only counting tells
      #                     them apart, and nothing in CI counted.
      #   jail-and-tree     containment: the opaque-origin CSP jail, the
      #                     bridge, iframe height, and a node failure staying
      #                     inside its boundary in the consumer's words.
      #
      # DELIBERATELY STILL OUT, with reasons rather than silence:
      #   keyboard.spec.ts     the whole file asserts :focus-visible outlines
      #                        (`expectFocusIndicator` on every tab stop),
      #                        which headless CI mis-resolves — the same reason
      #                        the legacy specs above stay local. It is GREEN
      #                        locally: the product defect this comment used to
      #                        cite (`workspace tabs rove…`, the Automations
      #                        tab's aria-selected stuck at "false") was real
      #                        and is fixed — an ACT was sitting in the tablist
      #                        with role="tab", forcing manual activation. The
      #                        focus-order coverage CI actually needs is in
      #                        center-a11y (H10/H18/M34), which is green here.
      #   screenshots.spec.ts  writes PNGs; it is a capture job, not a gate.
      #   live-voice.spec.ts   needs OPENAI_API_KEY and a real model.
      - name: UI solidity + stress suite
        run: >-
          pnpm --filter @vendoai/ui test:browser
          e2e/smoke.spec.ts
          e2e/stress.spec.ts
          e2e/scroll-management.spec.ts
          e2e/extreme-content.spec.ts
          e2e/theme.spec.ts
          e2e/height-chain.spec.ts
          e2e/pass3-consumer-voice.spec.ts
          e2e/wave3-consumer-voice.spec.ts
          e2e/run-history-voice.spec.ts
          e2e/build-failed-banner.spec.ts
          e2e/accessibility.spec.ts
          e2e/center-a11y.spec.ts
          e2e/approvals-poller-proof.spec.ts
          e2e/jail-and-tree.spec.ts
      - if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: ui-browser-playwright-trace
          path: packages/ui/e2e/test-results
          retention-days: 7

  # Supply-chain gate: fails on high/critical advisories in the PRODUCTION
  # dependency graph (what ships in the published tarballs). Scoped to --prod so
  # dev-tooling advisories (vitest/vite/esbuild dev servers) — which never ship
  # to consumers and are tracked by Renovate instead — do not gate releases.
  # --audit-level=high keeps the known moderate postcss finding (via the private
  # host-app fixture's Next.js) from reddening the gate. See renovate.json.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # npm permanently retired the legacy audit endpoints on 2026-07-15 (HTTP
      # 410); `pnpm audit` queries the replacement bulk-advisory endpoint from
      # pnpm 11 (pnpm/pnpm#11265), which the repo now pins via packageManager.
      #
      # 2026-07-26: registry.npmjs.org started serving the bulk-advisory
      # response gzip-compressed WITHOUT a Content-Encoding header, which pnpm
      # cannot decode — ERR_PNPM_AUDIT_BAD_RESPONSE on perfectly clean trees,
      # freezing every merge for hours. Real advisory findings still FAIL this
      # step; only that exact endpoint-infra signature degrades, after
      # retries, to a loud warning so a registry outage cannot block the
      # train while contributing zero security signal.
      - run: |
          for attempt in 1 2 3; do
            set +e
            pnpm audit --prod --audit-level high > /tmp/audit-out.txt 2>&1
            code=$?
            set -e
            tail -c 4000 /tmp/audit-out.txt | tr -d '\0' || true
            if [ "$code" -eq 0 ]; then exit 0; fi
            if ! grep -aq "ERR_PNPM_AUDIT_BAD_RESPONSE" /tmp/audit-out.txt; then
              exit "$code"
            fi
            echo "::warning::npm bulk-advisory endpoint returned an undecodable response (attempt $attempt); retrying"
            sleep 20
          done
          echo "::warning::npm bulk-advisory endpoint is broken (gzip without Content-Encoding, tracked 2026-07-26); audit is SKIPPED this run and gates again once the endpoint recovers"
