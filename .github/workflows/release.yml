name: Release

on:
  # Real release: pushing a v* tag publishes the fixed lockstep group to npm.
  push:
    tags: ["v*"]
  # Dry run by default: manually dispatch to prove the publish end-to-end WITHOUT
  # publishing. Runs the same gate + `pnpm -r publish --dry-run`.
  workflow_dispatch:
    inputs:
      publish:
        # version-packages.yml sets this, dispatching at the tag it just pushed:
        # a GITHUB_TOKEN tag push can never fire the `push: tags` trigger above,
        # and a dispatch can. Leave it off for a hand-run dry run.
        description: Publish for real
        type: boolean
        default: false

# id-token: write powers npm trusted publishing (OIDC) AND provenance: the
# workflow's OIDC token is exchanged for a short-lived npm credential, so
# there is no NPM_TOKEN secret anywhere. Each package on npmjs.com lists this
# repo + this workflow file as its trusted publisher (see CONTRIBUTING.md,
# "Releases").
#
# The publish itself uses the npm CLI (>= 11.5.1), not `pnpm publish`: pnpm
# 11.10's own token exchange 404s against npmjs ("Unknown error"), verified
# 2026-07-21 with a per-package exchange probe that returned 201 for the same
# claims via the documented endpoint. pnpm still does the packing, because
# `pnpm pack` rewrites workspace:* deps to real versions.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # No registry-url here on purpose: setup-node would write an
      # `_authToken=${NODE_AUTH_TOKEN}` line into .npmrc, and that placeholder
      # defeats OIDC trusted publishing (actions/setup-node#1551). pnpm
      # publishes to registry.npmjs.org by default and negotiates OIDC itself.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      # The same GitHub-cache-backed turbo remote cache ci.yml fills, so `build`
      # and `typecheck` below replay whatever has already been built for this
      # exact commit instead of recompiling it.
      #
      # How much that is depends on a race, honestly: the tag names the version
      # commit, and main's own CI run on that commit starts seconds before this
      # one, so the two build in parallel and this job replays only the tasks CI
      # finished first. What is NOT a race is a second run at the same tag — a
      # re-run after a flaky publish reads back its own tag-scoped cache and is
      # pure replay. (GitHub scopes cache writes to the current ref and lets any
      # ref read the default branch's, which is what makes both directions work.)
      - name: Turbo remote cache (GitHub-cache backed)
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      - run: pnpm install --frozen-lockfile
      # BUILD + TYPECHECK, not the full gate. This workflow only ever runs at a
      # tag, and that tag's tree already merged through main's required checks
      # (ci, integration, conformance, audit) — re-running the suite here proved
      # nothing a second time and put ~38 minutes between "merge the version PR"
      # and "it is on npm". Build stays because the tarballs are its output;
      # typecheck stays because it is seconds and it reads the .d.ts files the
      # build emits, which are what users actually compile against.
      - run: pnpm build
      - run: pnpm typecheck

      # Dry run (workflow_dispatch): prove the publish resolves + packs without
      # touching the registry. --provenance is dropped here (no tag/release to
      # attest to, and dry runs mint no attestation).
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        run: pnpm -r --filter './packages/*' publish --dry-run --no-git-checks --access public

      # Real publish (v* tag, or a dispatch with publish=true): pack every
      # public workspace with pnpm (rewrites workspace:*), then publish each
      # tarball with npm's OIDC trusted publishing + provenance. Versions
      # already on the registry are skipped, so re-runs are safe. No token env
      # by design.
      - name: Publish to npm
        if: github.event_name == 'push' || inputs.publish
        run: |
          set -euo pipefail
          npm install -g npm@11
          npm --version
          rm -rf /tmp/vendo-tarballs && mkdir -p /tmp/vendo-tarballs
          pnpm -r --filter './packages/*' exec pnpm pack --out /tmp/vendo-tarballs/%s-%v.tgz
          # Map package name -> tarball, then publish in DEPENDENCY order
          # (pnpm -r exec runs topologically, umbrella last). Alphabetical
          # order would publish the vendoai umbrella first — a mid-run
          # failure would then leave an installable version pointing at
          # unpublished deps.
          declare -A TARBALL
          while IFS= read -r tarball; do
            TARBALL[$(tar -xzOf "$tarball" package/package.json | jq -r .name)]=$tarball
          done < <(find /tmp/vendo-tarballs -name '*.tgz')
          while IFS= read -r name; do
            tarball=${TARBALL[$name]:?no tarball packed for $name}
            version=$(tar -xzOf "$tarball" package/package.json | jq -r .version)
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already on the registry)"
              continue
            fi
            echo "publish $name@$version"
            npm publish "$tarball" --access public --provenance
          # Private packages are enumerated out here, not skipped in the loop:
          # `npm publish` throws EPRIVATE before it ever reaches the registry
          # (libnpmpublish/lib/publish.js), and under `set -e` that aborts the
          # release partway through, after earlier packages are already live.
          done < <(pnpm -r --filter './packages/*' exec node -e "const p=require('./package.json'); if (!p.private) process.stdout.write(p.name+'\n')")

  # Opening the @vendoai bump PR on vendo-web is its OWN job so that its
  # failures are visible. It used to be the publish job's last step under
  # `continue-on-error: true`, and that combination is how the console sat on a
  # stale release for two days: v0.38.0's bump died on
  # ERR_PNPM_NO_MATCHING_VERSION, the annotation was a warning inside a green
  # release, and nobody had any reason to look. A separate job can go red on its
  # own without claiming the publish failed — the publish really did succeed,
  # and the packages really are on npm.
  #
  # GITHUB_TOKEN is scoped to this repo alone, so this needs its own cross-repo
  # credential; without it the job says so and stops green, because a missing
  # optional secret is not a failure.
  bump-console:
    needs: publish
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    # Narrower than the workflow default: this job reads this repo and talks to
    # vendo-web with VENDO_WEB_PAT. It publishes nothing, so it has no business
    # holding the OIDC token that `publish` mints npm credentials with.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Open the vendo-web dep bump PR
        env:
          GH_TOKEN: ${{ secrets.VENDO_WEB_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::VENDO_WEB_PAT is not set — skipping the vendo-web bump PR"
            exit 0
          fi
          version=$(node -p "require('./packages/vendo/package.json').version")
          # EVERY package the bump will pin, not just the umbrella. The lockstep
          # group is exactly the public packages carrying this version, so
          # matching on it is also what excludes @vendoai/telemetry, which
          # versions on its own and never rides the bump.
          group=$(node -e '
            const fs = require("fs");
            for (const dir of fs.readdirSync("packages")) {
              const file = "packages/" + dir + "/package.json";
              if (!fs.existsSync(file)) continue;
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              if (!pkg.private && pkg.version === process.argv[1]) console.log(pkg.name);
            }' "$version")
          # `npm publish` returning is not the same as the version being
          # installable: the registry's read path lags the write, and this job
          # starts immediately after. v0.38.0's bump asked pnpm for a version npm
          # had not surfaced yet and died with ERR_PNPM_NO_MATCHING_VERSION.
          #
          # Every package is checked because propagation is per-package and
          # unordered — the umbrella can be live while a sibling still 404s, and
          # pnpm resolves all of them. One 5-minute budget covers the whole set.
          deadline=$(( SECONDS + 300 ))
          for name in $group; do
            until npm view "$name@$version" version >/dev/null 2>&1; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::$name@$version is still not resolvable 5 minutes after publish — refusing to open a bump PR pnpm cannot install"
                exit 1
              fi
              sleep 5
            done
          done
          echo "all of $(printf '%s' "$group" | wc -w) published packages resolve at $version"
          # The branch prefix is a contract: vendo-web's vendoai-bump-merge
          # workflow only ever merges `vendoai-bump/*`.
          branch="vendoai-bump/v$version"
          git clone --depth=1 "https://x-access-token:$GH_TOKEN@github.com/runvendo/vendo-web.git" /tmp/vendo-web
          cd /tmp/vendo-web
          # THREE pnpm projects, not one. The repo root (marketing site) and
          # apps/console are the obvious two; apps/console/checker is an
          # isolated workspace nested INSIDE the console, with its own manifest
          # and its own lockfile, so no install in the console can ever reach
          # it. Bumping the first two and leaving it behind is what stranded
          # the checker on 0.34.0 for two releases (vendo-web#608).
          #
          # Rewritten in place so each file's own formatting survives; catches
          # both `dependencies` and `pnpm.overrides`. @vendoai/telemetry is
          # deliberately excluded: it is outside this repo's changesets `fixed`
          # group and versions on its own, so it must never ride the lockstep
          # bump. (It is a `file:` reference today, which the semver pattern
          # skips anyway — the name is excluded so that holds if it is ever
          # published as a version.)
          for dir in . apps/console apps/console/checker; do
            node -e '
              const fs = require("fs");
              const [version, file] = process.argv.slice(1);
              fs.writeFileSync(file, fs.readFileSync(file, "utf8")
                .replace(/"@vendoai\/(?!telemetry")[a-z-]+": "\d+\.\d+\.\d+"/g,
                  (dep) => dep.replace(/\d+\.\d+\.\d+/, version)));
            ' "$version" "$dir/package.json"
          done
          # Fail closed on whatever the rewrite could not reach. That regex only
          # moves EXACT pins, so a range (`^0.36.1`), a `pnpm.overrides` entry or
          # anything else added to these files later would be skipped in silence
          # while the PR still went out claiming it covered all three projects —
          # the same shape of miss as vendo-web#608, one layer up. Every pin is
          # exact today, so this is quiet until the day it is not.
          for dir in . apps/console apps/console/checker; do
            missed=$(grep -oE '"@vendoai/[^"]+": "[^"]+"' "$dir/package.json" \
              | grep -v '^"@vendoai/telemetry"' | grep -vF ": \"$version\"") || true
            if [ -n "$missed" ]; then
              echo "::error::$dir/package.json still holds @vendoai deps the bump could not rewrite, so this release is only half applied: $missed"
              exit 1
            fi
          done
          if git diff --quiet; then
            echo "vendo-web is already on $version"
            exit 0
          fi
          # pnpm 9 is what vendo-web's own CI installs with, and it runs
          # --frozen-lockfile: a lockfile written by this repo's pnpm 11 would
          # fail there. Without this refresh the PR is red on arrival. One
          # install per project — each owns a separate lockfile.
          for dir in . apps/console apps/console/checker; do
            npx --yes pnpm@9 install --lockfile-only --ignore-scripts --dir "$dir"
          done
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -am "chore: bump @vendoai/* to $version"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --head "$branch" \
            --title "chore: bump @vendoai/* to $version" \
            --body "Automated by runvendo/vendo's release workflow for v$version. Covers all three pnpm projects — the root site, \`apps/console\` and the isolated \`apps/console/checker\` workspace — with each lockfile regenerated. \`@vendoai/telemetry\` is outside the release group and is left alone."
