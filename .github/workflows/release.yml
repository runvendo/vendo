name: Release

on:
  # Real release: pushing a v* tag publishes the fixed lockstep group to npm.
  push:
    tags: ["v*"]
  # Dry run by default: manually dispatch to prove the publish end-to-end WITHOUT
  # publishing. Runs the same gate + `pnpm -r publish --dry-run`.
  workflow_dispatch:
    inputs:
      publish:
        # version-packages.yml sets this, dispatching at the tag it just pushed:
        # a GITHUB_TOKEN tag push can never fire the `push: tags` trigger above,
        # and a dispatch can. Leave it off for a hand-run dry run.
        description: Publish for real
        type: boolean
        default: false

# id-token: write powers npm trusted publishing (OIDC) AND provenance: the
# workflow's OIDC token is exchanged for a short-lived npm credential, so
# there is no NPM_TOKEN secret anywhere. Each package on npmjs.com lists this
# repo + this workflow file as its trusted publisher (see CONTRIBUTING.md,
# "Releases").
#
# The publish itself uses the npm CLI (>= 11.5.1), not `pnpm publish`: pnpm
# 11.10's own token exchange 404s against npmjs ("Unknown error"), verified
# 2026-07-21 with a per-package exchange probe that returned 201 for the same
# claims via the documented endpoint. pnpm still does the packing, because
# `pnpm pack` rewrites workspace:* deps to real versions.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # No registry-url here on purpose: setup-node would write an
      # `_authToken=${NODE_AUTH_TOKEN}` line into .npmrc, and that placeholder
      # defeats OIDC trusted publishing (actions/setup-node#1551). pnpm
      # publishes to registry.npmjs.org by default and negotiates OIDC itself.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      # The same GitHub-cache-backed turbo remote cache ci.yml fills, so `build`
      # and `typecheck` below replay whatever has already been built for this
      # exact commit instead of recompiling it.
      #
      # How much that is depends on a race, honestly: the tag names the version
      # commit, and main's own CI run on that commit starts seconds before this
      # one, so the two build in parallel and this job replays only the tasks CI
      # finished first. What is NOT a race is a second run at the same tag — a
      # re-run after a flaky publish reads back its own tag-scoped cache and is
      # pure replay. (GitHub scopes cache writes to the current ref and lets any
      # ref read the default branch's, which is what makes both directions work.)
      - name: Turbo remote cache (GitHub-cache backed)
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      - run: pnpm install --frozen-lockfile
      # BUILD + TYPECHECK, not the full gate. This workflow only ever runs at a
      # tag, and that tag's tree already merged through main's required checks
      # (ci, integration, conformance, audit) — re-running the suite here proved
      # nothing a second time and put ~38 minutes between "merge the version PR"
      # and "it is on npm". Build stays because the tarballs are its output;
      # typecheck stays because it is seconds and it reads the .d.ts files the
      # build emits, which are what users actually compile against.
      - run: pnpm build
      - run: pnpm typecheck

      # Dry run (workflow_dispatch): prove the publish resolves + packs without
      # touching the registry. --provenance is dropped here (no tag/release to
      # attest to, and dry runs mint no attestation).
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        run: pnpm -r --filter './packages/*' publish --dry-run --no-git-checks --access public

      # Real publish (v* tag, or a dispatch with publish=true): pack every
      # public workspace with pnpm (rewrites workspace:*), then publish each
      # tarball with npm's OIDC trusted publishing + provenance. Versions
      # already on the registry are skipped, so re-runs are safe. No token env
      # by design.
      - name: Publish to npm
        if: github.event_name == 'push' || inputs.publish
        run: |
          set -euo pipefail
          npm install -g npm@11
          npm --version
          rm -rf /tmp/vendo-tarballs && mkdir -p /tmp/vendo-tarballs
          pnpm -r --filter './packages/*' exec pnpm pack --out /tmp/vendo-tarballs/%s-%v.tgz
          # Map package name -> tarball, then publish in DEPENDENCY order
          # (pnpm -r exec runs topologically, umbrella last). Alphabetical
          # order would publish the vendoai umbrella first — a mid-run
          # failure would then leave an installable version pointing at
          # unpublished deps.
          declare -A TARBALL
          while IFS= read -r tarball; do
            TARBALL[$(tar -xzOf "$tarball" package/package.json | jq -r .name)]=$tarball
          done < <(find /tmp/vendo-tarballs -name '*.tgz')
          while IFS= read -r name; do
            tarball=${TARBALL[$name]:?no tarball packed for $name}
            version=$(tar -xzOf "$tarball" package/package.json | jq -r .version)
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already on the registry)"
              continue
            fi
            echo "publish $name@$version"
            npm publish "$tarball" --access public --provenance
          # Private packages are enumerated out here, not skipped in the loop:
          # `npm publish` throws EPRIVATE before it ever reaches the registry
          # (libnpmpublish/lib/publish.js), and under `set -e` that aborts the
          # release partway through, after earlier packages are already live.
          done < <(pnpm -r --filter './packages/*' exec node -e "const p=require('./package.json'); if (!p.private) process.stdout.write(p.name+'\n')")
