name: Knowledge Eval

# The knowledge eval gate (docs/eval/KNOWLEDGE.md): deterministic offline
# legs only — golden-set retrieval vs expected doc ids, refusal mechanics,
# ratcheted bars — against the in-memory engine. Exits nonzero on any hard
# failure or bars breach. Model-costed judging and live engines stay
# on-demand. Demoted from a per-PR gate to nightly (2026-08-06, Yousef's
# call): an eval regression caught overnight is soon enough.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  knowledge-eval:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Turbo remote cache (GitHub-cache backed)
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Knowledge eval (memory engine, strict)
        run: |
          set -o pipefail
          pnpm corpus knowledge-eval --engine memory --strict --json > knowledge-eval-scorecard.json
          pnpm corpus knowledge-eval --engine memory --strict | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Harness coverage ratchet (knowledge-eval module)
        run: pnpm --filter @vendoai/corpus-harness test:coverage
      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: knowledge-eval-scorecard
          path: knowledge-eval-scorecard.json
          retention-days: 30
