name: trivy

# SOC 2 container-image scanning. This repo ships exactly one image —
# examples/demo-bank (Maple) — and CI never builds it: Railway builds it at
# deploy time from the repo root with examples/demo-bank/Dockerfile. So this
# workflow reproduces that build purely to scan it, and fails on a CRITICAL.
#
# It is deliberately NOT one of the required checks (ci, integration,
# conformance, audit) — renaming or absorbing those breaks merges.
on:
  pull_request:
    paths:
      - "examples/demo-bank/Dockerfile"
      - ".dockerignore"
      - ".github/workflows/trivy.yml"
  # A base image grows new CRITICALs without the Dockerfile changing, so the
  # scan also runs on its own every Monday.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Repo-root context with -f, exactly how `railway up` builds it — the
      # Dockerfile COPYs the whole workspace and runs the turbo build.
      - name: Build the demo-bank image
        run: docker build -f examples/demo-bank/Dockerfile -t demo-bank:scan .

      - name: Scan the demo-bank image for CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: demo-bank:scan
          severity: CRITICAL
          exit-code: "1"
          format: table
          ignore-unfixed: true
